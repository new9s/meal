<style>
@import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css");

:root {
  --bg: #f6f8f7;
  --card: #ffffff;
  --fg: #111827;
  --sub: #64748b;
  --line: #e2e8f0;
  --accent: #14b875;
  --accent-top: #38df98;
  --accent-bot: #0b995e;
  --accent-soft: #e8f8f0;
  --accent-fg: #ffffff;
  --chip: #e8f8f0;
  --chip-active: #14b875;
  --warn: #b45309;
  --warnbg: #fef3c7;
  --nav-btn-bg: linear-gradient(180deg, #f4fbf7 0%, #e6f4ec 100%);
  --nav-btn-border: #c5e4d4;
  --nav-btn-fg: #149a60;
  --today-bg: linear-gradient(180deg, #ebf9f2 0%, #d6f1e4 100%);
  --today-border: #22b573;
  --today-fg: #0b6e41;
  --main-dish: #064e3b;
  --main-dish-bg: linear-gradient(180deg, #dcfaec 0%, #c8f5e0 52%, #d8f9ea 100%);
  --main-dish-border: #2ec986;
  --main-dish-fg: #064e3b;
  --main-glow-1: rgba(52, 211, 153, 0.52);
  --main-glow-2: rgba(16, 185, 129, 0.24);
  --shadow: 0 6px 20px -2px rgba(15, 35, 25, 0.05), 0 2px 6px -1px rgba(15, 35, 25, 0.03);
  --card-shadow: 0 6px 20px -2px rgba(15, 35, 25, 0.05), 0 2px 6px -1px rgba(15, 35, 25, 0.03);
  --active-glow: 0 8px 18px -2px rgba(16, 185, 129, 0.45), 0 0 12px rgba(52, 211, 153, 0.35);
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0c1511;
    --card: #13221c;
    --fg: #f1f7f4;
    --sub: #94aea3;
    --line: #233c31;
    --accent: #22c580;
    --accent-top: #4ade9e;
    --accent-bot: #0ca668;
    --accent-soft: #1a3329;
    --accent-fg: #062115;
    --chip: #1a3329;
    --chip-active: #34d399;
    --warn: #fcd34d;
    --warnbg: #3b2a0a;
    --nav-btn-bg: linear-gradient(180deg, #1b3228 0%, #14261e 100%);
    --nav-btn-border: #2e5443;
    --nav-btn-fg: #52d99c;
    --today-bg: linear-gradient(180deg, #1c382c 0%, #142b21 100%);
    --today-border: #34d399;
    --today-fg: #6ee7b7;
    --main-dish: #a7f3d0;
    --main-dish-bg: linear-gradient(180deg, #183b2d 0%, #122f24 55%, #193e2f 100%);
    --main-dish-border: #34d399;
    --main-dish-fg: #a7f3d0;
    --main-glow-1: rgba(52, 211, 153, 0.42);
    --main-glow-2: rgba(16, 185, 129, 0.20);
    --shadow: 0 8px 26px rgba(0, 0, 0, 0.45);
    --card-shadow: 0 8px 26px rgba(0, 0, 0, 0.45);
    --active-glow: 0 8px 22px -2px rgba(16, 185, 129, 0.5), 0 0 16px rgba(52, 211, 153, 0.4);
  }
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0 auto;
  max-width: 520px;
  background: var(--bg);
  color: var(--fg);
  font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  font-size: 19.2px !important;
  padding: max(20px, env(safe-area-inset-top)) 16px max(32px, env(safe-area-inset-bottom));
  line-height: 1.5;
  letter-spacing: -0.025em;
}

/* 키프레임 애니메이션 모음 */
@keyframes logoFloat {
  0%, 100% { transform: translateY(0px) rotate(0deg); }
  50% { transform: translateY(-2.5px) rotate(1.5deg); }
}
@keyframes titleArtBreath {
  0%, 100% { transform: translateY(0px) scale(1); filter: drop-shadow(0 2px 6px rgba(16, 185, 129, 0.12)); }
  50% { transform: translateY(-1.5px) scale(1.012); filter: drop-shadow(0 5px 12px rgba(16, 185, 129, 0.28)); }
}
@keyframes titleArtBreathDark {
  0%, 100% { transform: translateY(0px) scale(1); filter: brightness(1.3) saturate(1.15) drop-shadow(0 2px 8px rgba(52, 211, 153, 0.32)); }
  50% { transform: translateY(-1.5px) scale(1.012); filter: brightness(1.38) saturate(1.2) drop-shadow(0 5px 15px rgba(52, 211, 153, 0.5)); }
}
@keyframes pillGlowPulse {
  0%, 100% { box-shadow: 0 0 0 3px rgba(52, 211, 153, 0.22), 0 5px 16px rgba(16, 185, 129, 0.42), inset 0 1.5px 1px rgba(255, 255, 255, 0.65); }
  50% { box-shadow: 0 0 0 4.5px rgba(52, 211, 153, 0.34), 0 7px 22px rgba(16, 185, 129, 0.6), inset 0 1.5px 2px rgba(255, 255, 255, 0.8); }
}
@keyframes statusDotBlink {
  0%, 100% { transform: scale(1); opacity: 1; box-shadow: 0 0 6px #ffffff, 0 0 10px #a7f3d0; }
  50% { transform: scale(1.25); opacity: 0.85; box-shadow: 0 0 10px #ffffff, 0 0 16px #6ee7b7; }
}
@keyframes batteryPulse {
  0%, 100% { box-shadow: 0 3px 12px rgba(245, 158, 11, 0.28), inset 0 1px 1px rgba(255, 255, 255, 0.8); }
  50% { box-shadow: 0 4px 18px rgba(245, 158, 11, 0.48), 0 0 10px rgba(251, 191, 36, 0.35), inset 0 1px 1px rgba(255, 255, 255, 0.9); }
}
@keyframes mainDishAura {
  0%, 100% {
    box-shadow:
      0 0 18px 4px var(--main-glow-1),
      0 0 36px 10px var(--main-glow-2),
      inset 0 1.5px 2px rgba(255, 255, 255, 0.85);
  }
  50% {
    box-shadow:
      0 0 26px 7px var(--main-glow-1),
      0 0 48px 16px var(--main-glow-2),
      inset 0 1.5px 3px rgba(255, 255, 255, 0.95);
  }
}
@keyframes borderOrbitGlow {
  0% {
    top: 0%;
    left: 10%;
    width: 105px;
    height: 16px;
  }
  32% {
    top: 0%;
    left: 90%;
    width: 105px;
    height: 16px;
  }
  36% {
    top: 18%;
    left: 99%;
    width: 36px;
    height: 28px;
  }
  40% {
    top: 38%;
    left: 100%;
    width: 16px;
    height: 46px;
  }
  46% {
    top: 62%;
    left: 100%;
    width: 16px;
    height: 46px;
  }
  50% {
    top: 82%;
    left: 99%;
    width: 36px;
    height: 28px;
  }
  54% {
    top: 100%;
    left: 90%;
    width: 105px;
    height: 16px;
  }
  86% {
    top: 100%;
    left: 10%;
    width: 105px;
    height: 16px;
  }
  90% {
    top: 82%;
    left: 1%;
    width: 36px;
    height: 28px;
  }
  93% {
    top: 62%;
    left: 0%;
    width: 16px;
    height: 46px;
  }
  97% {
    top: 38%;
    left: 0%;
    width: 16px;
    height: 46px;
  }
  99% {
    top: 18%;
    left: 1%;
    width: 36px;
    height: 28px;
  }
  100% {
    top: 0%;
    left: 10%;
    width: 105px;
    height: 16px;
  }
}
@keyframes livePulseRed {
  0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.55), 0 4px 12px rgba(239, 68, 68, 0.35); }
  50% { box-shadow: 0 0 0 5px rgba(239, 68, 68, 0), 0 6px 18px rgba(239, 68, 68, 0.55); }
}

/* 1단계: 상단 헤더 */
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 2px 0 18px;
  gap: 8px;
}
h1 {
  font-size: 28.8px !important;
  font-weight: 800;
  margin: 0;
  display: flex;
  align-items: center;
  flex: 1;
  min-width: 0;
  gap: 10px;
  color: var(--accent);
  line-height: 1.3;
  letter-spacing: -0.045em;
}
.logo-theme-preview {
  display: flex;
  flex: 0 0 auto;
  width: 64px !important;
  height: 64px !important;
  border-radius: 50%;
  background: var(--card);
  border: 1.5px solid var(--line);
  padding: 4px;
  box-shadow: 0 4px 14px rgba(15, 40, 28, 0.08);
  animation: logoFloat 4s ease-in-out infinite;
}
.logo-theme-preview img {
  width: 100% !important;
  height: 100% !important;
  object-fit: contain;
  border-radius: 50%;
}
h1 .title-art-preview {
  display: block;
  width: 196px;
  max-width: calc(100% - 74px);
  height: auto;
  object-fit: contain;
  flex: 0 1 auto;
  animation: titleArtBreath 3.6s ease-in-out infinite;
}
@media (prefers-color-scheme: dark) {
  .logo-theme-preview {
    box-shadow: 0 4px 16px rgba(16, 185, 129, 0.22);
    border-color: #2d5241;
  }
  h1 .title-art-preview {
    animation: titleArtBreathDark 3.6s ease-in-out infinite;
  }
}

/* 우측 자동 갱신 중 입체 캡슐 */
.auto-pill {
  flex: none;
  font-size: 13px !important;
  font-weight: 700;
  color: #ffffff;
  background: linear-gradient(180deg, #43df99 0%, #17b874 52%, #0c9b5e 100%);
  padding: 7px 14px;
  border-radius: 999px;
  border: 1.5px solid #86efac;
  display: flex;
  align-items: center;
  gap: 6px;
  text-shadow: 0 1px 2px rgba(0, 60, 30, 0.25);
  animation: pillGlowPulse 3s ease-in-out infinite;
}
.auto-pill::before {
  content: "";
  width: 7px;
  height: 7px;
  background: #bbf7d0;
  border-radius: 50%;
  animation: statusDotBlink 2s ease-in-out infinite;
}

/* 공통 카드 및 버튼 */
.card {
  background: var(--card);
  border: 1.5px solid var(--line);
  border-radius: 20px;
  padding: 20px;
  margin-bottom: 16px;
  box-shadow: var(--card-shadow);
}
button {
  font: inherit;
  cursor: pointer;
  border: 0;
  outline: none;
}
button:focus-visible, a:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}

/* 2단계: 주간 네비게이션 & 현재 시각 행 */
.nav {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 12px;
  align-items: center;
  padding: 20px 18px;
}
.nav button.go {
  width: 46px;
  height: 46px;
  border-radius: 13px;
  background: var(--nav-btn-bg);
  border: 1.5px solid var(--nav-btn-border);
  color: var(--nav-btn-fg);
  font-size: 26px !important;
  font-weight: 500;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 3px 8px rgba(16, 185, 129, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.6);
  transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}
@media (prefers-color-scheme: dark) {
  .nav button.go {
    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.08);
  }
}
.nav button.go:hover:not(:disabled) {
  background: linear-gradient(180deg, var(--accent-top) 0%, var(--accent-bot) 100%);
  border-color: var(--accent);
  color: #ffffff;
  transform: translateY(-1px);
  box-shadow: var(--active-glow);
}
.nav button.go:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}
.navtitle {
  text-align: center;
}
.navtitle .t-main {
  font-size: 20.5px !important;
  font-weight: 800;
  color: var(--fg);
  letter-spacing: -0.03em;
}
.status {
  font-size: 14.5px !important;
  font-weight: 500;
  color: var(--sub);
  margin-top: 5px;
  min-height: 20px;
}
.status.err {
  color: #ef4444;
}

.nowrow {
  display: flex;
  gap: 8px;
  align-items: center;
  justify-content: space-between;
  margin: 4px 2px 16px;
  padding: 2px 2px;
}
.now {
  font-size: 16px !important;
  color: var(--sub);
  margin: 0;
  font-weight: 500;
}
.now b {
  color: var(--fg);
  font-weight: 800;
}
.today-btn {
  min-height: 44px;
  padding: 8px 18px;
  border-radius: 13px;
  border: 1.5px solid var(--today-border);
  background: var(--today-bg);
  color: var(--today-fg);
  font-size: 15px !important;
  font-weight: 800;
  box-shadow: 0 4px 12px rgba(16, 185, 129, 0.14), inset 0 1px 0 rgba(255, 255, 255, 0.7);
  transition: all 0.2s ease;
}
@media (prefers-color-scheme: dark) {
  .today-btn {
    box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.1);
  }
}
.today-btn:hover {
  transform: translateY(-1px);
  box-shadow: 0 6px 16px rgba(16, 185, 129, 0.26);
}

/* 3단계: 식사 탭 4종 & 요일 선택 바 */
.tabs {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 9px;
  margin-bottom: 16px;
}
.tab {
  min-width: 0;
  min-height: 74px;
  padding: 12px 4px;
  border-radius: 16px;
  background: var(--card);
  border: 1.5px solid var(--line);
  color: var(--fg);
  font-size: 18.5px !important;
  font-weight: 800;
  text-align: center;
  box-shadow: 0 3px 10px rgba(0, 0, 0, 0.03);
  transition: all 0.22s cubic-bezier(0.4, 0, 0.2, 1);
}
.tab:hover:not([aria-selected="true"]) {
  border-color: var(--accent);
}
.tab small {
  display: block;
  font-weight: 500;
  font-size: 12px !important;
  color: var(--sub);
  margin-top: 4px;
  opacity: 0.95;
  letter-spacing: -0.02em;
}
.tab[aria-selected="true"] {
  background: linear-gradient(180deg, var(--accent-top) 0%, var(--accent) 52%, var(--accent-bot) 100%);
  color: #ffffff;
  border-color: #10b981;
  box-shadow: var(--active-glow), inset 0 1.5px 1px rgba(255, 255, 255, 0.55);
  transform: translateY(-1px);
}
.tab[aria-selected="true"] small,
.tab[aria-selected="true"] small::before {
  color: rgba(255, 255, 255, 0.95);
  font-weight: 600;
}

.days {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
  padding: 7px 6px;
  margin-bottom: 16px;
  border-radius: 18px;
  background: var(--card);
  border: 1.5px solid var(--line);
  box-shadow: var(--card-shadow);
}
.day {
  min-height: 58px;
  padding: 8px 2px;
  border-radius: 13px;
  background: transparent;
  color: var(--sub);
  font-size: 16px !important;
  font-weight: 600;
  text-align: center;
  transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}
.day small {
  display: block;
  font-size: 12px !important;
  font-weight: 500;
  margin-top: 4px;
  opacity: 0.9;
}
.day[aria-selected="true"] {
  background: linear-gradient(180deg, var(--accent-top) 0%, var(--accent) 52%, var(--accent-bot) 100%);
  color: #ffffff;
  font-weight: 800;
  border: 1px solid #34d399;
  box-shadow: 0 6px 15px rgba(16, 185, 129, 0.42), 0 0 10px rgba(52, 211, 153, 0.3), inset 0 1.5px 1px rgba(255, 255, 255, 0.55);
}
.day[aria-selected="true"] small {
  color: #ffffff;
  font-weight: 600;
  opacity: 1;
}
.day.today:not([aria-selected="true"]) {
  border: 1.5px solid var(--accent);
  color: var(--accent);
  font-weight: 800;
}

/* 4단계: 하단 식단 메뉴 카드 + 곧 식사 배지 + 메인 메뉴 테두리 회전 광채 */
.menu-box {
  min-height: 260px;
  display: flex;
  flex-direction: column;
  padding: 24px 20px 26px;
  border-radius: 22px;
}
.menu-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 18px;
  padding-bottom: 4px;
  border-bottom: none;
}
.badge {
  font-size: 21.5px !important;
  font-weight: 800;
  color: var(--fg);
  letter-spacing: -0.035em;
  display: flex;
  align-items: center;
  gap: 6px;
}

/* LIVE 배지 및 골드 옐로우 곧 식사 배지 (.badge-live.soon) */
.badge-live {
  position: relative;
  font-size: 12px !important;
  font-weight: 800;
  color: #ffffff;
  background: linear-gradient(180deg, #f87171 0%, #ef4444 55%, #dc2626 100%);
  padding: 6px 14px;
  border-radius: 99px;
  border: 1.5px solid #fca5a5;
  animation: livePulseRed 1.8s infinite;
}
.badge-live.soon {
  position: relative;
  color: #1e293b;
  background: linear-gradient(180deg, #fffbeb 0%, #fef08a 45%, #fde047 100%);
  border: 1.5px solid #f59e0b;
  border-radius: 8px;
  padding: 6px 14px;
  font-size: 12px !important;
  font-weight: 800;
  letter-spacing: -0.03em;
  white-space: nowrap;
  animation: batteryPulse 2.6s ease-in-out infinite;
}

/* 메뉴 리스트 및 메인 요리 민트 광채 박스 */
.menu-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 6px 0 10px;
  text-align: center;
}
.menu-list .t {
  position: relative;
  color: var(--main-dish-fg);
  background: var(--main-dish-bg);
  border: 1.5px solid var(--main-dish-border);
  font-weight: 800;
  font-size: 22.8px !important;
  padding: 15px 14px;
  border-radius: 13px;
  margin: 2px 2px 12px;
  letter-spacing: -0.02em;
  animation: mainDishAura 3.2s ease-in-out infinite;
  z-index: 1;
}
/* 메인 요리 테두리 전체를 느리게 도는 빛(Flare Orbit) 효과 */
.menu-list .t::before {
  content: "";
  position: absolute;
  top: 0%;
  left: 10%;
  width: 105px;
  height: 16px;
  transform: translate(-50%, -50%);
  background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.98) 0%, rgba(167, 243, 208, 0.85) 35%, rgba(52, 211, 153, 0.45) 62%, transparent 80%);
  pointer-events: none;
  filter: blur(1.2px);
  animation: borderOrbitGlow 9s linear infinite;
}
.menu-list .t::after {
  content: "";
  position: absolute;
  top: 0%;
  left: 10%;
  width: 135px;
  height: 24px;
  transform: translate(-50%, -50%) scale(1.25);
  background: radial-gradient(ellipse at center, rgba(110, 231, 183, 0.65) 0%, rgba(16, 185, 129, 0.32) 50%, transparent 78%);
  pointer-events: none;
  filter: blur(4px);
  animation: borderOrbitGlow 9s linear infinite;
}
.menu-list .l {
  font-size: 19px !important;
  color: var(--fg);
  font-weight: 600;
  padding: 5px 0;
  line-height: 1.5;
  letter-spacing: -0.02em;
}
.menu-list .empty {
  color: var(--sub);
  font-size: 16.8px !important;
  padding: 40px 0;
}

.warn {
  background: var(--warnbg);
  color: var(--warn);
  border-radius: 12px;
  padding: 11px 13px;
  font-size: 14.4px !important;
  margin-bottom: 12px;
  font-weight: 600;
}
.ocrnote {
  font-size: 12.5px !important;
  color: var(--sub);
  margin-top: 18px;
  text-align: center;
}
.links {
  display: flex;
  justify-content: center;
  gap: 8px 16px;
  flex-wrap: wrap;
  font-size: 13px !important;
  margin-top: 12px;
}
.links a,
.links button {
  min-height: 44px;
  display: inline-flex;
  align-items: center;
  color: var(--accent);
  text-decoration: underline;
  text-underline-offset: 3px;
  background: none;
  padding: 4px;
  font-weight: 600;
}

canvas {
  width: 100%;
  height: auto;
  display: block;
  border-radius: 8px;
}
.imgview {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
[hidden] {
  display: none !important;
}

@media (max-width: 440px) {
  .tabs { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .tab { min-width: 0; }
  .tab small { font-size: 0 !important; line-height: 0; }
  .tab small::before { display: block; font-size: 12px; line-height: 1.5; white-space: pre-line; }
  .tab[data-key="breakfast"] small::before { content: "06:10~\A 07:00"; }
  .tab[data-key="lunch"] small::before { content: "12:00~\A 13:00"; }
  .tab[data-key="dinner"] small::before { content: "17:30~\A 18:00"; }
  .tab[data-key="night"] small::before { content: "00:00~\A 00:30"; }
}
@media (max-width: 360px) {
  body { padding-left: 12px; padding-right: 12px; }
  h1 { font-size: 24px !important; }
  .auto-pill { padding: 6px 10px; font-size: 11.5px !important; }
}
</style>

<script>
const API = 'https://front.cjfreshmeal.co.kr/notice/v1/notice-detail';
const MEALS = [
  { key:'breakfast', label:'아침', time:'06:10~07:00', start: 6*60+10 },
  { key:'lunch',     label:'점심', time:'12:00~13:00', start: 12*60 },
  { key:'dinner',    label:'저녁', time:'17:30~18:00', start: 17*60+30 },
  { key:'night',     label:'야식', time:'00:00~00:30', start: 24*60 },
];

/* v1.5: 원본 좌표를 보존하고 1200px 분석본에서 선·식사명·요일을 교차 검증 */
let grid = null;
const MEAL_KEYS = ['breakfast','lunch','dinner','night'];
function detectGrid(im){
  const failed = reason => ({ detected:false, valid:false, reason });
  try {
    const W = 1200, ratio = im.naturalWidth / W, H = Math.round(im.naturalHeight / ratio);
    if (H < 300 || H > 2200) return failed('지원 범위를 벗어난 표 비율입니다.');
    const c = document.createElement('canvas'); c.width=W; c.height=H;
    const cx=c.getContext('2d',{willReadFrequently:true}); cx.drawImage(im,0,0,W,H);
    const data=cx.getImageData(0,0,W,H).data, L=new Float32Array(W*H);
    for(let p=0;p<L.length;p++) L[p]=.3*data[p*4]+.59*data[p*4+1]+.11*data[p*4+2];
    const runs=(arr,min)=>{const out=[];let a=-1;for(let i=0;i<=arr.length;i++){const on=i<arr.length&&arr[i]>min;if(on&&a<0)a=i;if(!on&&a>=0){out.push([a,i-1]);a=-1;}}return out;};
    const colScore=new Float32Array(W);
    for(let x=3;x<W-3;x++)for(let y=Math.floor(H*.14);y<H*.91;y++){const p=y*W+x;if(L[p]<215&&L[p]<L[p-3]-15&&L[p]<L[p+3]-15)colScore[x]++;}
    const vl=runs(colScore,H*.24);
    // 7개 요일은 같은 폭. 오른쪽 이미지 끝의 선은 잘릴 수 있어 끝점도 별도 확인한다.
    let chain=[];
    for(let a=0;a<vl.length-1;a++){
      const gap=vl[a+1][0]-vl[a][0]; if(gap<W*.09||gap>W*.17)continue;
      const cur=[vl[a]];
      for(let b=a+1;b<vl.length;b++){
        const delta=vl[b][0]-cur[cur.length-1][0];
        if(Math.abs(delta-gap)<=Math.max(3,gap*.025))cur.push(vl[b]);
        else if(delta>gap*1.04)break;
      }
      if(cur.length>chain.length)chain=cur;
    }
    if(chain.length<7||chain.length>8)return failed('7개 요일의 세로 경계를 확인하지 못했습니다.');
    if(chain.length===7){
      const gap=(chain[6][0]-chain[0][0])/6, edge=chain[6][0]+gap;
      if(Math.abs(edge-W)>5)return failed('오른쪽 표 경계가 불확실합니다.');
      let supported=0,total=0;
      for(let y=Math.floor(H*.18);y<H*.87;y++){total++;if(Math.min(L[y*W+W-1],L[y*W+W-2])<220)supported++;}
      // 잘린 오른쪽 끝점은 등간격과 이후 7개 요일명 검증을 모두 만족할 때만 허용한다.
      chain.push([W-1,W-1]);
    }
    const dayX=chain[0][0], leftLines=vl.filter(v=>v[1]<dayX-5);
    const clippedLeft=leftLines.length===1&&leftLines[0][0]<W*.06; if(clippedLeft)leftLines.unshift([0,0]); if(leftLines.length<2)return failed('식사명 열을 찾지 못했습니다.');
    const labelLeft=leftLines[leftLines.length-2],labelRight=leftLines[leftLines.length-1];
    if(labelRight[0]-labelLeft[1]<15)return failed('식사명 열이 너무 좁습니다.');
    const xa=labelLeft[1]+5, xb=labelRight[0]-5;
    if(xb-xa<8)return failed('식사명 열의 유효 폭이 부족합니다.');
    const labelScore=new Float32Array(H), rowScore=new Float32Array(H);
    for(let y=5;y<H-5;y++){
      let n=0;
      for(let x=xa;x<=xb;x++){
        const p=y*W+x,l=L[p],up=L[p-3*W],down=L[p+3*W];
        if(l<220&&l<up-12&&l<down-12)n++;
      }
      labelScore[y]=n/(xb-xa+1);
      for(let x=dayX+4;x<W-4;x++){const p=y*W+x;if(L[p]<215&&L[p]<L[p-3*W]-15&&L[p]<L[p+3*W]-15)rowScore[y]++;}
    }
    const rawRows=runs(labelScore,.65).filter(v=>v[0]>H*.08&&v[0]<H*.95), edges=[];
    for(const r of rawRows){const last=edges[edges.length-1];if(last&&r[0]-last[1]<=4)last[1]=r[1];else edges.push([...r]);}
    if(clippedLeft){const supports=edges.map(edge=>{const y=Math.round((edge[0]+edge[1])/2);let supported=0;const ratios=[];for(let k=0;k<7;k++){let hit=0,total=0;for(let x=chain[k][1]+5;x<chain[k+1][0]-5;x++){total++;let on=false;for(let yy=Math.max(4,y-3);yy<=Math.min(H-5,y+3);yy++){const p=yy*W+x;if(L[p]<220&&L[p]<L[p-3*W]-12&&L[p]<L[p+3*W]-12){on=true;break;}}if(on)hit++;}ratios.push(hit/Math.max(1,total));if(hit/Math.max(1,total)>.45)supported++;}return {edge,supported,ratios};}); for(let i=edges.length-1;i>=0;i--)if(supports[i].supported<4)edges.splice(i,1);}
    // 마지막 선 대신 지속적인 바닥 배경 전환이 있는 경우만 종료 경계로 보완한다.
    if(edges.length===4){
      for(let y=edges[3][1]+Math.floor(H*.07);y<H*.94;y++){
        let supported=0,total=0;
        for(let x=xa;x<=xb;x++){total++;const before=L[(y-5)*W+x];if(before-L[(y+8)*W+x]>40&&before-L[(y+16)*W+x]>40)supported++;}
        if(supported/total>.85){
          let across=0;for(let k=0;k<7;k++){const x=Math.round((chain[k][1]+chain[k+1][0])/2);if(L[(y-5)*W+x]-L[(y+8)*W+x]>30)across++;}
          if(across>=4){let bestY=y,bestDrop=0;for(let yy=y;yy<=y+10;yy++){let drop=0;for(let x=xa;x<=xb;x++)drop+=L[(yy-1)*W+x]-L[(yy+1)*W+x];if(drop>bestDrop){bestDrop=drop;bestY=yy;}}edges.push([bestY-1,bestY+1]);break;}
        }
      }
    }
    // 식사명 병합 열에는 4개 식사 바깥 경계 5개만 있어야 한다. 부가 메뉴선은 이 열을 통과하지 않는다.
    if(edges.length!==5)return failed('식사 경계가 5개로 일치하지 않습니다. 임의 좌표로 판독하지 않습니다.');
    const horizontal=runs(rowScore,(W-dayX)*.38);
    const before=horizontal.filter(v=>v[1]<edges[0][0]-2);
    if(before.length<1)return failed('요일 머리글 경계가 불확실합니다.');
    const weekdayTop=before[before.length-1];
    const earlier=before.length>1?before[before.length-2]:null;
    // 날짜/요일 두 줄의 위쪽 경계가 긴 선으로 안 잡히면 라벨색 전환에서 찾는다.
    let stripTop=earlier&&weekdayTop[0]-earlier[1]<2*(edges[0][0]-weekdayTop[0])?earlier[1]+1:Math.max(0,weekdayTop[0]-(edges[0][0]-weekdayTop[0]));
    const bands=MEAL_KEYS.map((key,i)=>({key,top:edges[i][1]+1,bottom:edges[i+1][0]-1}));
    for(const b of bands)if(b.bottom-b.top<H*.065||b.bottom-b.top>H*.4)return failed('식사 칸 높이가 비정상입니다.');
    const widths=chain.slice(0,7).map((v,i)=>chain[i+1][0]-v[1]);
    const mean=widths.reduce((a,b)=>a+b)/7;
    if(widths.some(v=>Math.abs(v-mean)>mean*.05))return failed('요일 칸 폭이 서로 일치하지 않습니다.');
    // 서로 다른 요일에서 경계 근거가 반복되는지 확인한다. 선이 일부 끊겨도 4칸 이상은 지지해야 한다.
    for(const edge of edges.slice(0,4)){
      const y=Math.round((edge[0]+edge[1])/2);let supported=0;
      for(let k=0;k<7;k++){let hit=0,total=0;for(let x=chain[k][1]+5;x<chain[k+1][0]-5;x++){total++;let on=false;for(let yy=Math.max(4,y-3);yy<=Math.min(H-5,y+3);yy++){const p=yy*W+x;if(L[p]<220&&L[p]<L[p-3*W]-12&&L[p]<L[p+3*W]-12){on=true;break;}}if(on)hit++;}if(hit/Math.max(1,total)>.45)supported++;}
      if(supported<4)return failed('가로 경계가 여러 요일에서 확인되지 않습니다.');
    }
    const toOriginal=v=>Math.round(v*ratio), bounds=edges.map(v=>v.map(toOriginal));
    const meals={}; for(let i=0;i<4;i++)meals[MEAL_KEYS[i]]=[bounds[i][1]+1,bounds[i+1][0]-1];
    const cols=chain.map(v=>v.map(toOriginal));cols[7][0]=Math.min(im.naturalWidth-1,cols[7][0]);cols[7][1]=Math.min(im.naturalWidth-1,cols[7][1]);

    // 정규화 과정의 1~2px 오차는 원본 픽셀에서 다시 정밀화한다.

function mealAt(d){
  const m = d.getHours() * 60 + d.getMinutes();
  if (m < 30)         return { key:'night', dayShift:-1, isLive: true };
  if (m < 7*60)       return { key:'breakfast', dayShift:0, isLive: m >= 6*60 + 10 };
  if (m < 13*60)      return { key:'lunch', dayShift:0, isLive: m >= 12*60 };
  if (m < 18*60)      return { key:'dinner', dayShift:0, isLive: m >= 17*60 + 30 };
  return { key:'night', dayShift:0, isLive: false };
}

const $ = id => document.getElementById(id);

const BATCH = 6, MAX_MISS = 10, MAX_STEPS = 25;

async function fetchNotice(i){
  try{
    const r = await fetch(`${API}?boardIdx=${i}`);
    const j = await r.json();
    return (j.retCode === '00' && j.data) ? j.data : null;
  }catch(e){ return null; }
}
const sigOf = t => (t||'').replace(/\d+/g,'#').replace(/\s+/g,' ').trim();

async function findSame(from, dir, sig){
  let miss = 0, i = from + dir;
  for (let step = 0; step < MAX_STEPS && i > 0; step++){
    const ids = Array.from({length:BATCH}, (_,k) => i + k*dir).filter(x => x > 0);
    const res = await Promise.all(ids.map(fetchNotice));
    for (let k = 0; k < ids.length; k++){
      if (!res[k]){ if (++miss >= MAX_MISS && dir > 0) return null; continue; }
      miss = 0;
      if (sameForm(res[k], sig)) return res[k];
    }
    i += BATCH*dir;
  }
  return null;
}

function weekStartOf(n){
  const m = /^(\d{1,2})\.(\d{1,2})\./.exec(n.orgFileNm || '');
  if (!m) return null;
  const reg = new Date(n.regDt);
  let y = reg.getFullYear();
  if (+m[1] < reg.getMonth()+1 - 6) y++;
  return new Date(y, +m[1]-1, +m[2]);
}

function loadImage(src){

    im.onload = () => res(im);

}

async function show(n){

  setStatus('표 구조와 식사명·요일 확인 중…');
  const nextImage=await loadImage(n.fileNm),candidate=detectGrid(nextImage);

  if(my!==showSequence)return;
  img=nextImage;grid=checked;ocrCache.clear();

async function go(dir){
  userManuallyInteracted = true;
  setBusy(true); setStatus(dir < 0 ? '이전 식단 확인 중…' : '다음 식단 확인 중…');
  try{
    const n = await findSame(notice.boardIdx, dir, sigOf(notice.title));
    if (!n){ setStatus(dir < 0 ? '더 이전 식단이 없습니다.' : '더 최신 식단이 없습니다.', true); return; }
    await show(n);
  }catch(e){ setStatus(e.message || '불러오기에 실패했습니다.', true); }
  finally{ setBusy(false); }
}

async function start(isSilent = false){
  const startedAtSequence=showSequence;
  if (!isSilent) { setBusy(true); setStatus('최신 식단 확인 중…'); }
  try{
    let seedIdx = SEED_IDX;
    try{ seedIdx = +localStorage.getItem('mealIdx') || SEED_IDX; }catch(e){}
    const seed = await fetchNotice(seedIdx) || await fetchNotice(SEED_IDX);
    if (!seed) throw new Error('식단 공지를 불러오지 못했습니다.');
    const sig = sigOf(seed.title);
    const chain = [seed];
    for (let n = seed; (n = await findSame(n.boardIdx, 1, sig)); ) chain.push(n);
    const today = new Date(); today.setHours(0,0,0,0);
    for (let n = seed, k = 0; k < 6 && (weekStartOf(n) || 0) > today; k++){
      n = await findSame(n.boardIdx, -1, sig); if (!n) break;
      chain.unshift(n);
    }
    const inWeek = n => { const s = weekStartOf(n); return s && today >= s && today < new Date(s.getTime() + 7*864e5); };
    const started = chain.filter(n => { const s = weekStartOf(n); return s && s <= today; });
    const pick = chain.find(inWeek) || started[started.length-1] || chain[chain.length-1];
    
    if(startedAtSequence!==showSequence)return;
    if (!notice || notice.boardIdx !== pick.boardIdx) {
      await show(pick);
    } else {
      syncCurrentTimeState();
    }
  }catch(e){ 
    if (!isSilent) {
      setStatus(e.message || '불러오기에 실패했습니다.', true); 
      $('ntitle').textContent = '식단을 불러오지 못했습니다';
    }
  }finally{ 
    if (!isSilent) setBusy(false); 
  }
}

function syncCurrentTimeState(){
  if (!notice) return;
  const now = new Date();
  const mt = mealAt(now);
  const base = new Date(now); base.setDate(base.getDate() + mt.dayShift);
  const ws = notice.weekStart;
  const sameWeek = d => { const x = new Date(d); x.setHours(0,0,0,0); return ws ? (x >= ws && x < new Date(ws.getTime()+7*864e5)) : true; };
  todayCol = sameWeek(now) ? dowCol(now) : -1;

  if (!userManuallyInteracted) {
    state.meal = mt.key;
    state.day = sameWeek(base) ? dowCol(base) : 0;
  }
  buildTabs(); buildDays(); render();
}

function init(){
  userManuallyInteracted = false;
  $('view').hidden = false;
  $('full').href = notice.fileNm;
  syncCurrentTimeState();
}

function buildTabs(){
  $('tabs').innerHTML = '';
  MEALS.forEach(m => {
    const b = document.createElement('button');
    b.className = 'tab'; b.setAttribute('role','tab');
    b.innerHTML = `${m.label}<small>${m.time}</small>`;
    b.onclick = () => { userManuallyInteracted = true; state.meal = m.key; render(); };
    b.dataset.key = m.key;
    $('tabs').appendChild(b);
  });
}

function buildDays(){
  $('days').innerHTML = '';
  DOW.forEach((n,i) => {
    const b = document.createElement('button');
    b.className = 'day' + (i === todayCol ? ' today' : '');
    const ws = notice.weekStart;
    if (ws){ const t = new Date(ws); t.setDate(t.getDate()+i); b.innerHTML = `${n}<small>${t.getMonth()+1}/${t.getDate()}</small>`; }
    else b.textContent = n;
    b.onclick = () => { userManuallyInteracted = true; state.day = i; render(); };
    b.dataset.i = i;
    $('days').appendChild(b);
  });
}

function cellRect(day, meal, g=grid){
  if(!g||!g.valid)throw new Error('검증되지 않은 식사 칸입니다.');
  const [a,b] = meal === 'header' ? g.strip : g.meals[meal];
  const x = g.cols[day][1] + 1, xe = g.cols[day+1][0] - 1;
  return { x, y: a, w: Math.max(1, xe - x), h: Math.max(1, b - a + 1) };

  document.querySelectorAll('.day').forEach(b => b.setAttribute('aria-selected', +b.dataset.i === state.day));

  const mt = mealAt(now);
  const isTargetDay = todayCol >= 0 && state.day === dowCol(new Date(now.getTime() + mt.dayShift*864e5));
  const isNowMeal = isTargetDay && state.meal === mt.key;

  $('now').innerHTML = `현재 <b>${now.getMonth()+1}월 ${now.getDate()}일(${DOW[dowCol(now)]}) ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}</b>`;

  if (isNowMeal && mt.isLive){ lb.hidden = false; lb.className = 'badge-live'; lb.textContent = 'LIVE'; }
  else if (isNowMeal){
    const left = mi.start - (now.getHours()*60 + now.getMinutes());
    const h = Math.floor(left/60), mm = left % 60;
    lb.hidden = false; lb.className = 'badge-live soon';
    lb.textContent = '곧 식사 · ' + (h ? h + '시간 ' : '') + mm + '분 후';
  } else lb.hidden = true;

  const w2 = $('warn');
  if (notice.weekStart){
    w2.hidden = todayCol >= 0;
    w2.textContent = '이번 주 식단이 아닙니다.';
  } else {
    const target = new Date(now); target.setDate(now.getDate() - dowCol(now) + state.day);
    w2.hidden = false;
    w2.textContent = `오늘 기준 ${target.getMonth()+1}월 ${target.getDate()}일 식단입니다.`;
  }

  if(!grid||!grid.valid){
    ++runId;$('menu').hidden=false;$('imgview').hidden=true;$('toggleImg').disabled=true;
    $('menu').innerHTML='';const warning=document.createElement('div');warning.className='warn';warning.textContent='판독 확인 필요: '+(grid&&grid.reason||'표 경계를 확인하지 못했습니다.');$('menu').appendChild(warning);
    const detailText=failureDescription(grid&&grid.failure);if(detailText){const detail=document.createElement('div');detail.className='empty';detail.textContent=detailText;$('menu').appendChild(detail);}
    const help=document.createElement('div');help.className='empty';help.textContent='잘못된 칸의 OCR은 중단했어요. 전체 원본 보기를 이용해 주세요.';$('menu').appendChild(help);
    $('ocrNote').textContent='표 검증에 실패해 텍스트 판독을 중단했습니다.';
    if(!$('all').hidden){const c=$('all');c.width=img.naturalWidth;c.height=img.naturalHeight;c.getContext('2d').drawImage(img,0,0);}return;
  }
  $('toggleImg').disabled=false;
  $('ocrNote').textContent='텍스트 인식 결과로 일부 오차가 있을 수 있습니다.';
  crop($('dateStrip'), cellRect(state.day, 'header'), 2.5);
  crop($('cell'), cellRect(state.day, state.meal), 2.5);$('imgview').hidden = !showImg;
  $('menu').hidden = showImg;
  $('toggleImg').textContent = showImg ? '텍스트로 보기' : '이미지로 원본 대조';

  if (!$('all').hidden){ const g = grid; crop($('all'), { x: 0, y: g.strip[0], w: img.naturalWidth, h: g.meals.night[1] - g.strip[0] + 1 }, 1.5); }

  if (!showImg) showText(); else ++runId;
}

    const creation=Tesseract.createWorker('kor',1,{logger:m=>{
      if(backgroundDateOCR)return;
      if(m.status&&m.status.includes('loading'))$('menu').dataset.msg='엔진 준비 중… '+Math.round((m.progress||0)*100)+'%';
      else if(m.status==='recognizing text')$('menu').dataset.msg='메뉴 판독 중… '+Math.round((m.progress||0)*100)+'%';
      const el=document.querySelector('#menu .empty');if(el&&$('menu').dataset.msg)el.textContent=$('menu').dataset.msg;
    }});
    const setup=creation.then(async w=>{made=w;if(abandoned){await terminateOCRWorker(w);throw new Error('OCR 준비 시간 초과');}await setOCRParameters(w,{tessedit_pageseg_mode:'6',preserve_interword_spaces:'0'},'main');return w;});
    const promise=withOCRDeadline(setup,20000,()=>{abandoned=true;if(made)invalidateOCRWorker('main',made);else creation.then(w=>terminateOCRWorker(w)).catch(()=>{});});
    workerP=promise;promise.then(w=>{promise.__w=w;}).catch(()=>{});promise.catch(()=>{if(workerP===promise)workerP=null;});
  }

}


// ── 1) 줄 나누기 ──
function isInk(d,i){const r=d[i],g=d[i+1],b=d[i+2];return .3*r+.59*g+.11*b<165||(r>150&&g<90&&b<90);}
function splitLines(image,rect){
  const w=Math.round(rect.w),h=Math.round(rect.h),c=document.createElement('canvas');c.width=w;c.height=h;
  const cx=c.getContext('2d',{willReadFrequently:true});cx.drawImage(image,rect.x,rect.y,rect.w,rect.h,0,0,w,h);
  const img=cx.getImageData(0,0,w,h),d=img.data,N=w*h,mask=new Uint8Array(N);
  for(let p=0;p<N;p++)if(isInk(d,p*4))mask[p]=1;
  // 글자보다 큰 그림, 가장자리의 색 장식, 칸 안 구분선은 지운다
  const maxH=image.naturalWidth/2416*19*1.7,edge=Math.max(2,Math.round(w*.012)),lab=new Int32Array(N),stack=new Int32Array(N),drop=[];let n=0;
  for(let p=0;p<N;p++){if(!mask[p]||lab[p])continue;n++;let sp=0;stack[sp++]=p;lab[p]=n;let x0=w,x1=-1,y0=h,y1=-1,cnt=0,sat=0;
    while(sp){const q=stack[--sp],x=q%w,y=(q-x)/w,i=q*4;cnt++;x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y);sat+=Math.max(d[i],d[i+1],d[i+2])-Math.min(d[i],d[i+1],d[i+2]);
      if(x>0&&mask[q-1]&&!lab[q-1]){lab[q-1]=n;stack[sp++]=q-1;}if(x<w-1&&mask[q+1]&&!lab[q+1]){lab[q+1]=n;stack[sp++]=q+1;}
      if(y>0&&mask[q-w]&&!lab[q-w]){lab[q-w]=n;stack[sp++]=q-w;}if(y<h-1&&mask[q+w]&&!lab[q+w]){lab[q+w]=n;stack[sp++]=q+w;}}
    const ch=y1-y0+1,cw=x1-x0+1;
    if(ch>maxH||(cw>(w-2*edge)*.6&&ch<=3)||((x0<=edge||x1>=w-1-edge)&&sat/cnt>45))drop[n]=1;}
  for(let p=0;p<N;p++)if(mask[p]&&drop[lab[p]]){mask[p]=0;d[p*4]=d[p*4+1]=d[p*4+2]=255;}
  // mask는 줄 위치 분석에만 사용한다. 판독용 canvas의 원본 픽셀은 지우지 않는다.
  const row=new Array(h).fill(0),lx=new Array(h).fill(w),rx=new Array(h).fill(-1);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(mask[y*w+x]){row[y]++;lx[y]=Math.min(lx[y],x);rx[y]=Math.max(rx[y],x);}
  const bands=[];let s=-1;
  for(let y=0;y<=h;y++){const on=y<h&&row[y]>=1;if(on&&s<0)s=y;if(!on&&s>=0){const p=bands[bands.length-1];if(p&&s-p.b<=2)p.b=y-1;else bands.push({t:s,b:y-1});s=-1;}}
  const hs=bands.map(q=>q.b-q.t+1).sort((a,b)=>a-b),med=hs.length?hs[Math.floor(hs.length/2)]:10,lines=[];
  for(const q of bands){const hh=q.b-q.t+1;if(hh<med*.45)continue;let L=w,R=-1,ink=0;for(let y=q.t;y<=q.b;y++){L=Math.min(L,lx[y]);R=Math.max(R,rx[y]);ink+=row[y];}
    if(R-L<hh*.6||ink<hh*2||Math.abs((L+R)/2-w/2)>w*.22)continue;   // 가운데 정렬이 아닌 로고·장식 줄 제외
    lines.push({t:q.t,b:q.b,l:L,r:R,h:hh});}
  return {lines,canvas:c,data:d,mask,w,h};
}
function isRedLine(cell,ln){let ink=0,red=0;for(let y=ln.t;y<=ln.b;y++)for(let x=ln.l;x<=ln.r;x++){const p=y*cell.w+x;if(!cell.mask[p])continue;ink++;const i=p*4;if(cell.data[i]>140&&cell.data[i+1]<100&&cell.data[i+2]<100)red++;}return ink>0&&red/ink>.35;}
function glyphPitch(image,red){return (red?21.4:18.0)*image.naturalWidth/2416;}   // 원본 기준 한글 한 글자 폭
// 줄(또는 일부 구간)을 확대·흰 여백을 둔 판독용 이미지로
function lineImage(cell,ln,x0,x1,scale){const P=20,a=Math.max(0,x0-2),b=Math.min(cell.w-1,x1+2),t=Math.max(0,ln.t-2),bt=Math.min(cell.h-1,ln.b+2);
  const c=document.createElement('canvas');c.width=Math.round((b-a+1)*scale)+2*P;c.height=Math.round((bt-t+1)*scale)+2*P;
  const cx=c.getContext('2d',{willReadFrequently:true});cx.fillStyle='#fff';cx.fillRect(0,0,c.width,c.height);cx.imageSmoothingEnabled=true;cx.imageSmoothingQuality='high';
  cx.drawImage(cell.canvas,a,t,b-a+1,bt-t+1,P,P,c.width-2*P,c.height-2*P);
  const id=cx.getImageData(0,0,c.width,c.height),q=id.data;
  for(let i=0;i<q.length;i+=4){let l=.3*q[i]+.59*q[i+1]+.11*q[i+2];if(q[i]>150&&q[i+1]<90&&q[i+2]<90)l=Math.min(l,60);const v=l>200?255:l<90?0:Math.round((l-90)*255/110);q[i]=q[i+1]=q[i+2]=v;}
  cx.putImageData(id,0,0);return {canvas:c,origin:a,scale,pad:P};}

// 경량 판독: 기본 kor 엔진만 사용. 오타 교정·영문 보완·글자별 판독 없음.
function menuText(text){return String(text||'').replace(/[A-Za-z]/g,'').replace(/[^가-힣0-9&/]/g,'');}
async function readMenuLine(main,cell,ln,image){
  const title=isRedLine(cell,ln),pitch=glyphPitch(image,title),steps=[];
  const first=await recognizeOCR(main,lineImage(cell,ln,ln.l,ln.r,3).canvas);
  const raw=first.data.text||'';let text=menuText(raw);
  // 영문 제거로 줄어든 길이는 누락으로 취급하지 않는다. 숫자·기호 혼합 줄은 폭 추정에서 제외한다.
  const full=raw.replace(/\s/g,'');
  const count=Math.round((ln.r-ln.l+1)/pitch);
  if(/^[가-힣]+$/.test(full)&&count>text.length&&count-text.length<=2){
    try{
      const second=await recognizeOCR(main,lineImage(cell,ln,ln.l,ln.r,5).canvas);
      const candidate=menuText(second.data.text);
      if(candidate.length>text.length&&candidate.length<=count){text=candidate;steps.push('같은 엔진 줄 재판독');}
    }catch(e){steps.push('재판독 실패: 첫 결과 유지');}
  }
  return {text,title,raw,steps};
}
async function ocrCell(day,meal,context={image:img,grid,noticeId:notice&&notice.boardIdx}){
  if(!context.grid||!context.grid.valid)throw new Error('표 검증 실패');
  const started=performance.now(),rect=cellRect(day,meal,context.grid),cell=splitLines(context.image,rect),main=await getWorker();
  const lines=[],failures=[];
  let w=main;
  try{await setOCRParameters(w,{tessedit_pageseg_mode:'7'});
    for(const ln of cell.lines){let r=null;
      try{const current=await getWorker();if(current!==w){w=current;await setOCRParameters(w,{tessedit_pageseg_mode:'7'});}r=await readMenuLine(w,cell,ln,context.image);}catch(e){failures.push({type:'line-error',message:e.message});break;}
      if(r){if(r.text)lines.push(r);else failures.push({type:'empty-line'});}}
    if(!cell.lines.length&&cell.mask.some(v=>v))failures.push({type:'no-lines'});}
  finally{await setOCRParameters(w,{tessedit_pageseg_mode:'6'}).catch(()=>{});}
  return {lines,failures,status:!cell.lines.length?'empty':'ok',rect,elapsedMs:Math.round(performance.now()-started),engine:'v2.0-lite'};
}

// 날짜는 메뉴 표시를 막지 않는 후순위 진단이다. 같은 worker를 병렬 사용하지 않는다.
let foregroundOCR=0,dateAuditJob=null,backgroundDateOCR=false;
function dateJobIsCurrent(job){return job.sequence===showSequence&&notice&&notice.boardIdx===job.noticeId&&img===job.image&&grid===job.grid;}
function publishDateAudit(job){if(dateJobIsCurrent(job)&&window.mealDiagnostics&&window.mealDiagnostics.notice===job.noticeId)window.mealDiagnostics.dateAudit={status:job.status,results:job.results.slice(),passed:job.results.filter(r=>r.ok).length,total:7};}
function scheduleDateAuditTick(job,delay=0){
  if(job.timer||!dateJobIsCurrent(job)||job.index>=7)return;
  job.timer=setTimeout(()=>{
    job.timer=null;if(!dateJobIsCurrent(job))return;
    if(foregroundOCR>0){scheduleDateAuditTick(job,50);return;}
    const task=ocrChain.catch(()=>{}).then(async()=>{
      if(!dateJobIsCurrent(job))return;
      if(foregroundOCR>0){scheduleDateAuditTick(job,50);return;}
      job.status='running';publishDateAudit(job);backgroundDateOCR=true;const i=job.index,dt=new Date(job.weekStart);dt.setDate(dt.getDate()+i);
      const expected=String(dt.getMonth()+1)+'월'+dt.getDate()+'일';let worker=null,result;
      try{
        worker=await getWorker();await setOCRParameters(worker,{tessedit_pageseg_mode:'7'});
        const g=job.grid,c=labelCanvas(job.image,{x:g.cols[i][1]+2,y:g.header[0],w:g.cols[i+1][0]-g.cols[i][1]-4,h:g.header[1]-g.header[0]+1},true);
        result=c?await readCheckedLabel(worker,c,[expected]):{ok:false,expected:[expected],attempts:[],error:'날짜 글자를 찾지 못했습니다.'};
      }catch(e){result={ok:false,...(e.ocrAudit||{expected:[expected],attempts:[]}),error:e.message};}
      finally{if(worker)await setOCRParameters(worker,{tessedit_pageseg_mode:'6'}).catch(()=>{});backgroundDateOCR=false;}
      if(!dateJobIsCurrent(job))return;
      job.results.push({day:i,weekday:DOW[i],...result});job.index++;
      job.status=job.index===7?'complete':'pending';publishDateAudit(job);if(job.index<7)scheduleDateAuditTick(job);
    });
    ocrChain=task.catch(()=>{});
  },delay);
}
function scheduleDateAudit(context){
  if(context.sequence!==showSequence||!notice||notice.boardIdx!==context.noticeId||img!==context.image||grid!==context.grid)return;
  if(dateAuditJob&&dateAuditJob.sequence===context.sequence&&dateAuditJob.noticeId===context.noticeId)return;
  const ws=context.weekStart&&new Date(context.weekStart);
  if(!ws||!Number.isFinite(ws.getTime())){if(window.mealDiagnostics)window.mealDiagnostics.dateAudit={status:'skipped',reason:'공지 시작 날짜 없음',results:[]};return;}
  if(dateAuditJob&&dateAuditJob.timer)clearTimeout(dateAuditJob.timer);
  dateAuditJob={...context,weekStart:ws,index:0,results:[],status:'pending',timer:null};publishDateAudit(dateAuditJob);const job=dateAuditJob;requestAnimationFrame(()=>requestAnimationFrame(()=>scheduleDateAuditTick(job)));
}

function showText(){
  const box=$('menu'),my=++runId,context={image:img,grid,noticeId:notice.boardIdx,sequence:showSequence,weekStart:notice.weekStart};
  const key=context.noticeId+'|'+state.day+'|'+state.meal;
  const paint=result=>{
    if(my!==runId||showImg)return;
    box.innerHTML='';const empty=!result.lines.length;
    const unavailable=empty&&!(result.status==='empty'&&!(result.failures||[]).length);
    $('ocrNote').textContent=unavailable?'메뉴 표시를 완료하지 못했습니다.':'텍스트 인식 결과로 일부 오차가 있을 수 있습니다.';
    if(empty){const e=document.createElement('div');e.className='empty';e.textContent=unavailable?'식단 텍스트를 판독하지 못했습니다. 아래 원본 보기를 이용해 주세요.':'등록된 메뉴가 없는 빈 칸입니다.';box.appendChild(e);}
    result.lines.forEach(l=>{const d=document.createElement('div');d.className=l.title?'t':'l';d.textContent=l.text;d.title='OCR 원문: '+l.raw+(l.steps.length?' / '+l.steps.join(', '):'');box.appendChild(d);});
    if(unavailable)for(const f of result.failures||[]){const e=document.createElement('div');e.className='empty';e.textContent='실패 내용: '+(f.message||({'empty-line':'메뉴 줄에서 글자를 읽지 못했습니다.','no-lines':'메뉴 줄을 나누지 못했습니다.'}[f.type])||f.type);box.appendChild(e);}
    if(window.mealDiagnostics&&window.mealDiagnostics.notice===context.noticeId)window.mealDiagnostics.ocr[key]=result;
    // paint 뒤 새 macrotask에서 날짜 진단을 시작한다. 부분 메뉴가 보이면 실패 경고를 덧붙이지 않는다.
    if(!unavailable)scheduleDateAudit(context);
  };
  if(ocrCache.has(key)){paint(ocrCache.get(key));return;}
  box.innerHTML='<div class="empty">메뉴 불러오는 중…</div>';
  const d=state.day,m=state.meal;foregroundOCR++;
  ocrChain=ocrChain.catch(()=>{}).then(async()=>{
    try{
      if(my!==runId)return;
      if(ocrCache.has(key)){paint(ocrCache.get(key));return;}
      const result=await ocrCell(d,m,context);if(!result.failures.some(f=>f.type==='line-error'))ocrCache.set(key,result);paint(result);
    }catch(e){if(my!==runId||showImg)return;box.innerHTML='';const message=document.createElement('div');message.className='empty';message.textContent='판독 확인 필요: '+(e.message||'텍스트를 불러오지 못했습니다.')+' · 아래 원본 보기를 이용해 주세요.';box.appendChild(message);$('ocrNote').textContent='메뉴 표시를 완료하지 못했습니다.';
      if(window.mealDiagnostics&&window.mealDiagnostics.notice===context.noticeId)window.mealDiagnostics.ocr[key]={status:'failed',lines:[],failures:[{type:'exception',message:e.message}]};
    }finally{foregroundOCR=Math.max(0,foregroundOCR-1);}
  });
}

/* ───────── 자동 갱신 및 이벤트 바인딩 ───────── */
// 1분 주기 식사 시간 자동 갱신 & 시계 업데이트
let lastTouch = Date.now();
document.addEventListener('pointerdown', () => { lastTouch = Date.now(); });
setInterval(() => {
  // 5분 동안 조작이 없으면 자동으로 곧 먹을 식단으로 복귀
  if (userManuallyInteracted && Date.now() - lastTouch > 5*60000) userManuallyInteracted = false;
  syncCurrentTimeState();
}, 60000);

// 30분 주기 백그라운드 최신 식단 공지 재확인
setInterval(() => {
  start(true);
}, 30 * 60000);

// 브라우저 탭/화면 복귀 시 즉시 동기화
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    start(true);
  }
});

$('toggleAll').onclick = () => {
  const all = $('all'); all.hidden = !all.hidden;
  $('toggleAll').textContent = all.hidden ? '주간표 전체' : '주간표 닫기';
  if (!all.hidden) render();
};
$('toggleImg').onclick = () => { showImg = !showImg; render(); };$('today').onclick = async () => {
  userManuallyInteracted = false;
  const s = notice && notice.weekStart, t = new Date(); t.setHours(0,0,0,0);
  if (s && t >= s && t < new Date(s.getTime() + 7*864e5)) init();
  else await start();
};
$('prev').onclick = () => go(-1);$('next').onclick = () => go(1);

start();
