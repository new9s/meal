function mealAt(date){const minute=date.getHours()*60+date.getMinutes();if(minute<30)return {key:'night',dayShift:-1};if(minute<420)return {key:'breakfast',dayShift:0};if(minute<780)return {key:'lunch',dayShift:0};if(minute<1080)return {key:'dinner',dayShift:0};return {key:'night',dayShift:0};}

function lines(value,name){if(value===undefined)return [];if(!Array.isArray(value)||value.some(line=>typeof line!=='string'))throw Error(name+' 형식을 확인해 주세요.');return value;}
function normalizeWeek(raw,expected){
 if(!raw||typeof raw!=='object'||raw.schema_version!=='1.0')throw Error('지원하지 않는 JSON 버전이에요.');
 const start=raw.period?.start,end=raw.period?.end;
 if(addDays(start,6)!==end||new Date(dayTime(start)).getUTCDay()!==1)throw Error('식단 적용 기간을 확인해 주세요.');
 if(expected&&(expected.start!==start||expected.end!==end))throw Error('목록과 식단의 적용 기간이 달라요.');
 if(!Array.isArray(raw.days)||raw.days.length!==7)throw Error('7일 식단이 필요해요.');
 const validation=raw.provenance?.validation_status??raw.validation_status;
 if(validation!==undefined&&!['valid','validated','approved','structure_validated_visual_review'].includes(validation))throw Error('검증 대기 중인 식단이에요.');
 const uncertain=raw.transcription?.uncertain_items;
 if(uncertain!==undefined&&(!Array.isArray(uncertain)||uncertain.length))throw Error('판독 확인이 필요한 식단이에요.');
 const days=raw.days.map(day=>{
  dayTime(day.date);if(day.date<start||day.date>end||!Array.isArray(day.meals)||day.meals.length!==4)throw Error('날짜 또는 끼니 수를 확인해 주세요.');
  const meals=day.meals.map(m=>{
   const meal=typeof m?.meal==='string'&&Object.hasOwn(ALIASES,m.meal)?ALIASES[m.meal]:null;
   if(!meal||m.date!==day.date)throw Error('끼니의 날짜와 이름을 확인해 주세요.');
   if(!Array.isArray(m.menus)||m.menus.some(group=>!Array.isArray(group)||group.some(line=>typeof line!=='string')))throw Error('메뉴 구획 형식을 확인해 주세요.');
   const first=m.menus.map(group=>group.slice(0,1)),reported=m.main_menus;
   const shape=Array.isArray(reported)&&reported.length===first.length&&reported.every(group=>Array.isArray(group)&&group.every(line=>typeof line==='string'));
   const main_check=reported===undefined?'missing':!shape?'invalid':JSON.stringify(reported)===JSON.stringify(first)?'match':'mismatch';
   return {...m,meal,main_check,plus:lines(m.plus,'PLUS'),self_ramen:m.self_ramen==null?[]:typeof m.self_ramen==='string'?[m.self_ramen]:lines(m.self_ramen,'셀프라면')};
  });
  if(new Set(meals.map(m=>m.meal)).size!==4)throw Error('끼니가 중복되어 있어요.');
  return {date:day.date,meals};
 }).sort((a,b)=>a.date.localeCompare(b.date));
 if(new Set(days.map(d=>d.date)).size!==7)throw Error('날짜가 중복되어 있어요.');
 return {start,end,days,raw};
}
function normalizeIndex(raw,base){if(!raw||raw.schema_version!=='1.0'||!Array.isArray(raw.weeks))throw Error('주차 목록 형식을 확인해 주세요.');const rows=raw.weeks.map(row=>{if(addDays(row.start,6)!==row.end||new Date(dayTime(row.start)).getUTCDay()!==1)throw Error('주차 목록의 기간이 달라요.');if(typeof row.sha256!=='string'||!/^[a-fA-F0-9]{64}$/.test(row.sha256))throw Error('주차 해시 형식을 확인해 주세요.');if(row.board_idx!==undefined&&(!Number.isSafeInteger(row.board_idx)||row.board_idx<1))throw Error('공지 번호를 확인해 주세요.');return {start:row.start,end:row.end,url:safeUrl(row.path??row.url,base),sha:row.sha256.toLowerCase(),boardIdx:row.board_idx??null};}).sort((a,b)=>a.start.localeCompare(b.start));if(new Set(rows.map(row=>row.start)).size!==rows.length)throw Error('주차 목록이 중복되어 있어요.');return rows;}
async function getJSON(url){const r=await fetch(url,{cache:'no-store',credentials:'omit',signal:AbortSignal.timeout(10000)});if(!r.ok)throw Error('식단 서버 응답 오류 ('+r.status+').');return r.json();}
async function loadIndex(){const url=safeUrl(CONFIG.indexUrl,location.href);return normalizeIndex(await getJSON(url),url);}
async function readWeek(row){const cached=weekCache.get(row.start);if(row.sha&&cached?.sha===row.sha)return cached.week;const week=normalizeWeek(await getJSON(row.url),row);weekCache.set(row.start,{sha:row.sha,url:row.url,week});return week;}

// 첫 실행·새로고침에서만 호출합니다. JSON 갱신·화면 복귀와 독립적입니다.
const NOTICE_API='https://front.cjfreshmeal.co.kr/notice/v1/notice-detail';
const signature=title=>(title||'').replace(/\d+/g,'#').replace(/\s+/g,' ').trim();
const NOTICE_FORM=signature('9월 4주차 주간메뉴입니다:D');
function sourcePayload(n){
 if(!n||!Number.isSafeInteger(n.boardIdx)||n.boardIdx<1||typeof n.title!=='string'||!n.title.trim()||n.title.length>200||/[\u0000-\u001f\u007f-\u009f]/.test(n.title))throw Error('공지 정보 형식이 달라요.');
 if(typeof n.fileNm!=='string'||!/^[\x00-\x7f]+$/.test(n.fileNm)||!/^https:\/\/fsmealimageprd\.ifresh\.co\.kr\/upload\/notice\/[A-Za-z0-9_-]+\.(?:png|jpg|jpeg|webp)$/.test(n.fileNm))throw Error('원본 이미지 주소를 확인해 주세요.');
 return {boardIdx:n.boardIdx,title:n.title,fileNm:n.fileNm};
}
async function fetchNotice(id){
 const r=await fetch(NOTICE_API+'?boardIdx='+id,{credentials:'omit',signal:AbortSignal.timeout(10000)});
 const j=await r.json().catch(()=>null);
 if(r.status===500&&j?.status==='error'&&j.retCode==='99'&&j.retMsg==='DATA_NOT_FOUND'&&j.data===null)return null;
 if(!r.ok)throw Error('공지 서버 응답 오류 ('+r.status+').');
 if(j?.retCode!=='00')throw Error('공지 조회 응답을 확인해 주세요.');
 if(!j.data||!j.data.fileNm)return null;
 if(j.data.boardIdx!==id)throw Error('요청한 공지 번호와 응답이 달라요.');
 return j.data;
}
async function submitSource(n){
 const body=JSON.stringify(sourcePayload(n));if(new TextEncoder().encode(body).length>4096)throw Error('접수 정보 크기를 확인해 주세요.');
 const r=await fetch(CONFIG.sourceUrl,{method:'POST',headers:{'Content-Type':'application/json'},body,credentials:'omit',signal:AbortSignal.timeout(10000)});
 if(![200,202].includes(r.status))throw Error('원본 접수 응답 오류 ('+r.status+').');
 const receipt=await r.json();
 if(!/^[a-f0-9]{32}$/.test(receipt.job_id)||!['created','updated','duplicate'].includes(receipt.action)||!['pending','leased','completed','failed','superseded'].includes(receipt.state))throw Error('원본 접수 결과를 확인해 주세요.');
 return receipt;
}
async function findNextSource(from){
 let missing=0;
 for(let step=0;step<25;step++){
  const ids=Array.from({length:6},(_,i)=>from+step*6+i+1);
  const rows=await Promise.all(ids.map(async id=>{try{return {notice:await fetchNotice(id)};}catch(error){return {error};}}));
  for(const row of rows){if(row.error)throw row.error;if(row.notice){missing=0;if(signature(row.notice.title)===NOTICE_FORM)return sourcePayload(row.notice);}else if(++missing>=10)return null;}
 }
 return null;
}
async function discoverSources(){
 sourceError='';status();
 const ids=new Set(available.map(row=>row.boardIdx).filter(id=>Number.isSafeInteger(id)&&id>0));
 try{const saved=Number(localStorage.getItem('mealIdx'));if(Number.isSafeInteger(saved)&&saved>0)ids.add(saved);}catch{}
 if(!ids.size)ids.add(2121);
 let latest=null,error=null;
 try{
  for(const id of [...ids].sort((a,b)=>a-b)){
   try{const n=await fetchNotice(id);if(!n||signature(n.title)!==NOTICE_FORM)continue;await submitSource(n);if(!latest||n.boardIdx>latest.boardIdx)latest=n;}catch(e){error=e;}
  }
  if(!latest){if(error)throw error;return;}
  for(let count=0;count<8;count++){
   const next=await findNextSource(latest.boardIdx);if(!next){if(error)throw error;return;}
   await submitSource(next);latest=next;
   try{localStorage.setItem('mealIdx',String(latest.boardIdx));}catch{}
  }
  throw Error('공지 탐색 횟수에 도달했어요. 새로고침 후 다시 확인해 주세요.');
 }catch(e){sourceError='원본 확인·접수 미완료: '+(e.message||'네트워크 응답을 확인해 주세요.')+' 게시된 식단 표시는 유지해요.';status();}
 finally{if(latest)try{localStorage.setItem('mealIdx',String(latest.boardIdx));}catch{}}
}

function appendLines(parent,content,className,highlightFirst=false){const block=document.createElement('div');block.className=className;for(const [index,line] of content.entries()){const p=document.createElement('p');p.textContent=line;if(highlightFirst&&index===0)p.className='menu-main';block.append(p);}parent.append(block);}
function updateDays(){const start=notice?.start||mondayOf(currentSelection().date);document.querySelectorAll('.day').forEach((button,i)=>{const date=addDays(start,i),parts=date.split('-');button.querySelector('small').textContent=Number(parts[1])+'/'+Number(parts[2]);button.setAttribute('aria-label',Number(parts[1])+'월 '+Number(parts[2])+'일 '+DOW[i]+'요일');});}
function render(){
 const current=currentSelection(),start=notice?.start||mondayOf(current.date);
 if(!notice){selectedMeal=current.meal;selectedDay=Math.round((dayTime(current.date)-dayTime(start))/DAY_MS);}
 const date=addDays(start,selectedDay),meal=MEALS.find(m=>m.key===selectedMeal);
 document.querySelectorAll('.day').forEach((b,i)=>b.setAttribute('aria-pressed',String(i===selectedDay)));
 document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.meal===selectedMeal)));
 const key=(notice?'week':'empty')+'|'+start+'|'+selectedDay+'|'+selectedMeal;if(painted===key)return;painted=key;
 const root=$('menuText');root.replaceChildren();const heading=document.createElement('p');heading.className='meal-date';heading.textContent=Number(date.slice(5,7))+'월 '+Number(date.slice(8))+'일 '+DOW[selectedDay]+'요일 · '+meal.label;root.append(heading);
 if(!notice){appendLines(root,['식단 준비 중이에요.'],'menu-empty');$('view').hidden=false;return;}
 const item=notice.days[selectedDay].meals.find(m=>m.meal===selectedMeal);
 if(item.menus.some(group=>group.length)){item.menus.forEach(group=>{if(group.length)appendLines(root,group,'menu-group',true);});}else appendLines(root,['등록된 메뉴가 없어요.'],'menu-empty');
 for(const [title,content] of [['PLUS',item.plus],['셀프라면',item.self_ramen]])if(content.length){const h=document.createElement('p');h.className='extra-label';h.textContent=title;root.append(h);appendLines(root,content,'menu-extra');}
 $('view').hidden=false;
}
function clearNotice(){notice=null;manual=false;painted='';updateDays();render();}
function applyWeek(week){const current=currentSelection();if(!manual&&!inWeek(current.date,week)){clearNotice();return false;}notice=week;painted='';if(!manual){selectedMeal=current.meal;selectedDay=Math.round((dayTime(current.date)-dayTime(week.start))/DAY_MS);}updateDays();render();return true;}
async function show(row){const revision=selectionRevision,week=await readWeek(row);if(revision!==selectionRevision)return;if(!applyWeek(week)){homePending=true;return;}lastError='';status();}
function sync(){if(busy)return;if(manual&&Date.now()-lastTouch>=IDLE_MS)manual=false;if(manual&&notice){render();return;}const current=currentSelection(),row=pickCurrent(available,current.date);if(!row){clearNotice();status();return;}if(row.start!==notice?.start){run(()=>show(row),true);return;}selectedMeal=current.meal;selectedDay=Math.round((dayTime(current.date)-dayTime(notice.start))/DAY_MS);render();}
async function run(task,silent=false){if(busy)return;busy=true;$('prev').disabled=$('next').disabled=true;if(!silent)status('식단을 불러오는 중…');try{await task();}catch(error){lastError='식단 갱신 실패: '+(error.message||'서버 응답을 확인해 주세요.')+(notice?' 표시 중인 식단을 유지해요.':'');status();if(!notice){painted='';updateDays();render();}}finally{busy=false;$('prev').disabled=$('next').disabled=!available.length;if(homePending){homePending=false;manual=false;sync();}if(!busy&&refreshPending){refreshPending=false;refresh(true);}}}
function refresh(silent=false){
 if(busy){refreshPending=true;return;}
 return run(async()=>{
  const rows=await loadIndex();available=rows;
  for(const start of weekCache.keys())if(!rows.some(row=>row.start===start))weekCache.delete(start);
  if(notice&&!rows.some(row=>row.start===notice.start)){selectionRevision++;clearNotice();}
  if(!silent)manual=false;
  if(manual&&Date.now()-lastTouch>=IDLE_MS)manual=false;
  const row=manual&&notice?rows.find(row=>row.start===notice.start):pickCurrent(rows,currentSelection().date);
  if(!row){clearNotice();lastError='';status();return;}
  const revision=selectionRevision,next=await readWeek(row);
  if(revision!==selectionRevision&&notice?.start!==row.start)return;
  if(!applyWeek(next)){homePending=true;return;}lastError='';status();
 },silent);
}
function go(direction){if(busy)return;return run(async()=>{const current=currentSelection();let row;if(notice){const index=available.findIndex(r=>r.start===notice.start);row=available[index+direction];}else{const candidates=available.filter(r=>direction<0?r.end<current.date:r.start>current.date);row=direction<0?candidates.at(-1):candidates[0];}if(!row){status(direction<0?'더 이전 식단이 없어요.':'더 최신 식단이 없어요.');return;}selectionRevision++;manual=true;lastTouch=Date.now();await show(row);});}
DOW.forEach((name,i)=>{const b=document.createElement('button');b.className='day';b.dataset.day=String(i);const label=document.createTextNode(name),small=document.createElement('small');b.append(label,small);b.onclick=()=>{if(!notice)return;selectionRevision++;homePending=false;manual=true;lastTouch=Date.now();selectedDay=i;render();status();};$('days').insertBefore(b,$('next'));});
MEALS.forEach(meal=>{const b=document.createElement('button');b.className='tab';b.dataset.meal=meal.key;b.setAttribute('role','tab');const label=document.createTextNode(meal.label),small=document.createElement('small');small.textContent=meal.time;b.append(label,small);b.onclick=()=>{if(!notice)return;selectionRevision++;homePending=false;manual=true;lastTouch=Date.now();selectedMeal=meal.key;render();status();};$('tabs').append(b);});
$('prev').onclick=()=>go(-1);$('next').onclick=()=>go(1);$('home').onclick=()=>{selectionRevision++;manual=false;if(busy)homePending=true;else{sync();status();}};
document.addEventListener('pointerdown',()=>{if(manual)lastTouch=Date.now();});setInterval(sync,60000);setInterval(()=>{if(document.visibilityState==='visible')refresh(true);},CONFIG.refreshMs);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refresh(true);});refresh().then(()=>discoverSources());
})();
</script>
