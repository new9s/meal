<script>
(()=>{
'use strict';
// 화면은 한 번 만들고, 선택 상태와 이미지가 바뀔 때만 갱신한다.
const $ = id => document.getElementById(id);
const API = 'https://front.cjfreshmeal.co.kr/notice/v1/notice-detail';
const MEALS = [
  {key:'breakfast',label:'아침',time:'06:10~07:00'},
  {key:'lunch',label:'점심',time:'12:00~13:00'},
  {key:'dinner',label:'저녁',time:'17:30~18:00'},
  {key:'night',label:'야식',time:'00:00~00:30'}
];
const MEAL_KEYS = MEALS.map(m => m.key);
const DOW = ['월','화','수','목','금','토','일'];
const SEED_IDX = 2121, DAY_MS = 864e5, IDLE_MS = 5*60000;
let notice = null, image = null, grid = null, busy = false, lastTouch = 0, manual = false, displayNote = "";
let selectedDay = 0, selectedMeal = 'lunch', painted = '', available = [], refreshPending = false, homePending = false;
const dayIndex = d => (d.getDay()+6)%7;
const signature = title => (title||'').replace(/\d+/g,'#').replace(/\s+/g,' ').trim();
const status = text => { $('status').textContent=text; $('status').hidden=!text; };

function mealAt(date){
  const minute=date.getHours()*60+date.getMinutes();
  if(minute<30)return {key:'night',dayShift:-1};
  if(minute<420)return {key:'breakfast',dayShift:0};
  if(minute<780)return {key:'lunch',dayShift:0};
  if(minute<1080)return {key:'dinner',dayShift:0};
  return {key:'night',dayShift:0};
}
function weekStartOf(n){
  const m=/^(\d{1,2})\.(\d{1,2})\./.exec(n.orgFileNm||'');
  if(!m)return null;
  const reg=new Date(n.regDt), year=reg.getFullYear()+(+m[1]<reg.getMonth()+1-6?1:0);
  const d=new Date(year,+m[1]-1,+m[2]);
  return Number.isFinite(d.getTime())?d:null;
}
function inWeek(date,start){return start&&date>=start&&date<new Date(start.getTime()+7*DAY_MS);}
async function fetchNotice(id){
  try{
    const r=await fetch(API+'?boardIdx='+id,{signal:AbortSignal.timeout(10000)});
    const j=await r.json();return j.retCode==='00'&&j.data?.fileNm?j.data:null;
  }catch{return null;}
}
async function findSame(from,direction,form){
  let miss=0;
  for(let id=from+direction,step=0;step<25&&id>0;step++,id+=6*direction){
    const ids=Array.from({length:6},(_,i)=>id+i*direction).filter(i=>i>0);
    const rows=await Promise.all(ids.map(fetchNotice));
    for(let i=0;i<rows.length;i++){
      const n=rows[i];
      if(!n){if(++miss>=10&&direction>0)return null;continue;}
      miss=0;if(signature(n.title)===form)return n;
    }
  }
  return null;
}
function loadImage(src){

    const verdict=await readGridLabels(im,candidate,worker,wait);
    if(verdict.blocked)return {grid:null,note:'읽힌 요일·식사명과 칸 위치가 여러 곳에서 달라요. 전체 원본을 표시해요. 새로고침해 주세요.'};
    return {grid:candidate,note:verdict.unknown?'경계선을 보완했어요. 일부 글자는 칸 배치로 확인해 표시해요.':'경계선이 흐려 원본 해상도와 글자 확인으로 보완했어요.'};
  }catch(error){
    if(error.name==='SecurityError')return {grid:null,note:'브라우저가 이미지 분석을 허용하지 않아요. 전체 원본을 표시해요. 새로고침해 주세요.'};
    const reason=timedOut?'글자 확인 시간이 초과됐어요.':error.message||'글자 확인을 마치지 못했어요.';
    return candidate?{grid:candidate,note:'원본 해상도로 경계선을 보완했어요. '+reason+' 글자 확인은 생략했어요.'}:{grid:null,note:reason+' 전체 원본을 표시해요. 새로고침해 주세요.'};
  }finally{ended=true;if(worker)worker.terminate().catch(()=>{});}
}

function crop(canvas,day,range){
  const x=grid.cols[day][1]+1,w=grid.cols[day+1][0]-x-1,h=range[1]-range[0]+1;
  canvas.width=w*3;canvas.height=h*3;
  const ctx=canvas.getContext('2d');ctx.imageSmoothingQuality='high';
  ctx.drawImage(image,x,range[0],w,h,0,0,canvas.width,canvas.height);
}
function render(){
  if(!notice)return;
  const date=notice.weekStart&&new Date(notice.weekStart);
  if(date)date.setDate(date.getDate()+selectedDay);
  const meal=MEALS.find(m=>m.key===selectedMeal);
  $('badge').textContent=(date?(date.getMonth()+1)+'월 '+date.getDate()+'일 ':'')+DOW[selectedDay]+'요일 '+meal.label;
  document.querySelectorAll('.day').forEach((b,i)=>b.setAttribute('aria-pressed',i===selectedDay));
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.meal===selectedMeal));
  const key=notice.fileNm+'|'+selectedDay+'|'+selectedMeal;
  if(painted===key)return;
  painted=key;
  $('dateStrip').hidden=$('cell').hidden=!grid;$('whole').hidden=!!grid;
  if(grid){crop($('dateStrip'),selectedDay,grid.strip);crop($('cell'),selectedDay,grid.meals[selectedMeal]);}
  else if($('whole').getAttribute('src')!==notice.fileNm)$('whole').src=notice.fileNm;
}
function pickCurrent(rows,date){
  const started=rows.filter(n=>{const d=weekStartOf(n);return d&&d<=date;});
  return rows.find(n=>inWeek(date,weekStartOf(n)))||started.at(-1)||rows.at(-1);
}
function sync(){
  if(!notice)return;
  if(manual&&Date.now()-lastTouch>=IDLE_MS)manual=false;
  if(!manual){
    const now=new Date(),meal=mealAt(now),date=new Date(now);date.setDate(date.getDate()+meal.dayShift);
    const current=pickCurrent(available,date);
    if(current&&current.boardIdx!==notice.boardIdx&&!busy){run(()=>show(current),true);return;}
    selectedMeal=meal.key;selectedDay=inWeek(date,notice.weekStart)?dayIndex(date):0;
  }
  render();
}
async function show(n){
  const nextImage=await loadImage(n.fileNm), initialGrid=detectGrid(nextImage);
  const result=initialGrid?{grid:initialGrid,note:''}:await recoverGrid(nextImage);
  image=nextImage;grid=result.grid;displayNote=result.note;notice={...n,weekStart:weekStartOf(n)};painted='';
  try{localStorage.setItem('mealIdx',String(n.boardIdx));}catch{}
  document.querySelectorAll('.day').forEach((b,i)=>{
    const d=notice.weekStart&&new Date(notice.weekStart);if(d)d.setDate(d.getDate()+i);
    b.querySelector('small').textContent=d?(d.getMonth()+1)+'/'+d.getDate():'';
    b.setAttribute('aria-label',(d?(d.getMonth()+1)+'월 '+d.getDate()+'일 ':'')+DOW[i]+'요일');
  });
  $('view').hidden=false;status(displayNote);sync();
}
async function run(task,silent=false){
  if(busy)return;
  busy=true;$('prev').disabled=$('next').disabled=true;
  if(!silent)status('식단을 불러오는 중…');
  try{await task();}catch(error){status((error.message||'식단을 불러오지 못했어요.')+' 새로고침해 주세요.');}
  finally{
    busy=false;$('prev').disabled=$('next').disabled=false;
    if(homePending){homePending=false;manual=false;sync();}
    if(!busy&&refreshPending){refreshPending=false;refresh(true);}
  }
}
function refresh(silent=false){
  if(busy){refreshPending=true;return;}
  return run(async()=>{
    let id=SEED_IDX;try{id=+localStorage.getItem('mealIdx')||SEED_IDX;}catch{}
    const seed=await fetchNotice(id)||await fetchNotice(SEED_IDX);
    if(!seed)throw new Error('식단 공지를 불러오지 못했어요.');
    const form=signature(seed.title),chain=[seed];
    for(let n=seed;(n=await findSame(n.boardIdx,1,form));)chain.push(n);
    const today=new Date();today.setDate(today.getDate()+mealAt(today).dayShift);today.setHours(0,0,0,0);
    for(let n=seed,k=0;k<6&&(weekStartOf(n)||0)>today;k++){
      n=await findSame(n.boardIdx,-1,form);if(!n)break;chain.unshift(n);
    }
    available=chain;const pick=pickCurrent(available,today);
    if(silent&&manual&&Date.now()-lastTouch<IDLE_MS){status(displayNote);sync();return;}
    manual=false;
    if(!notice||notice.boardIdx!==pick.boardIdx||notice.fileNm!==pick.fileNm)await show(pick);
    else {status(displayNote);sync();}
  },silent);
}
function go(direction){
  if(!notice)return;
  return run(async()=>{
    const n=await findSame(notice.boardIdx,direction,signature(notice.title));
    if(!n){status(direction<0?'더 이전 식단이 없어요.':'더 최신 식단이 없어요.');return;}
    manual=true;lastTouch=Date.now();await show(n);
  });
}
DOW.forEach((name,i)=>{
  const b=document.createElement('button');b.className='day';b.dataset.day=i;
  b.innerHTML=name+'<small></small>';b.onclick=()=>{manual=true;lastTouch=Date.now();selectedDay=i;render();};
  $('days').insertBefore(b,$('next'));
});
MEALS.forEach(meal=>{
  const b=document.createElement('button');b.className='tab';b.dataset.meal=meal.key;b.setAttribute('role','tab');
  b.innerHTML=meal.label+'<small>'+meal.time+'</small>';
  b.onclick=()=>{manual=true;lastTouch=Date.now();selectedMeal=meal.key;render();};$('tabs').append(b);
});
$('prev').onclick=()=>go(-1);$('next').onclick=()=>go(1);
$('home').onclick=()=>{manual=false;if(busy)homePending=true;else sync();};
document.addEventListener('pointerdown',()=>{if(manual)lastTouch=Date.now();});
setInterval(sync,60000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refresh(true);});
refresh();
})();
</script>
