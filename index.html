// 화면은 한 번 만들고, 선택 상태와 이미지가 바뀔 때만 갱신한다.
const $ = id => document.getElementById(id);
const API = 'https://front.cjfreshmeal.co.kr/notice/v1/notice-detail';
const MEALS = [
  {key:'breakfast',label:'아침',time:'06:10~07:00'},
  {key:'lunch',label:'점심',time:'12:00~13:00'},
  {key:'dinner',label:'저녁',time:'17:30~18:00'},
  {key:'night',label:'야식',time:'00:00~00:30'}
];
const MEAL_KEYS = MEALS.map(m => m.key);
const DOW = ['월','화','수','목','금','토','일'];
const SEED_IDX = 2121, DAY_MS = 864e5, IDLE_MS = 5*60000;
let notice = null, image = null, grid = null, busy = false, lastTouch = 0, manual = false;
let selectedDay = 0, selectedMeal = 'lunch', painted = '', available = [], refreshPending = false, homePending = false;
const dayIndex = d => (d.getDay()+6)%7;
const signature = title => (title||'').replace(/\d+/g,'#').replace(/\s+/g,' ').trim();
const status = text => { $('status').textContent=text; $('status').hidden=!text; };

function mealAt(date){
  const minute=date.getHours()*60+date.getMinutes();
  if(minute<30)return {key:'night',dayShift:-1};
  if(minute<420)return {key:'breakfast',dayShift:0};
  if(minute<780)return {key:'lunch',dayShift:0};
  if(minute<1080)return {key:'dinner',dayShift:0};
  return {key:'night',dayShift:0};
}
function weekStartOf(n){
  const m=/^(\d{1,2})\.(\d{1,2})\./.exec(n.orgFileNm||'');
  if(!m)return null;
  const reg=new Date(n.regDt), year=reg.getFullYear()+(+m[1]<reg.getMonth()+1-6?1:0);
  const d=new Date(year,+m[1]-1,+m[2]);
  return Number.isFinite(d.getTime())?d:null;
}
function inWeek(date,start){return start&&date>=start&&date<new Date(start.getTime()+7*DAY_MS);}
async function fetchNotice(id){
  try{
    const r=await fetch(API+'?boardIdx='+id,{signal:AbortSignal.timeout(10000)});
    const j=await r.json();return j.retCode==='00'&&j.data?.fileNm?j.data:null;
  }catch{return null;}
}
async function findSame(from,direction,form){
  let miss=0;
  for(let id=from+direction,step=0;step<25&&id>0;step++,id+=6*direction){
    const ids=Array.from({length:6},(_,i)=>id+i*direction).filter(i=>i>0);
    const rows=await Promise.all(ids.map(fetchNotice));
    for(let i=0;i<rows.length;i++){
      const n=rows[i];
      if(!n){if(++miss>=10&&direction>0)return null;continue;}
      miss=0;if(signature(n.title)===form)return n;
    }
  }
  return null;
}
function loadImage(src){
  const load=cors=>new Promise((resolve,reject)=>{
    const im=new Image();if(cors)im.crossOrigin='anonymous';
    const timer=setTimeout(()=>{im.src='';reject(new Error('이미지 응답이 늦어요. 화면을 다시 열어 주세요.'));},10000);
    im.onload=()=>{clearTimeout(timer);resolve(im);};
    im.onerror=()=>{clearTimeout(timer);reject(new Error('식단 이미지를 불러오지 못했어요.'));};
    im.src=src;
  });
  return load(true).catch(()=>load(false));
}
function detectGrid(im){
  const failed = () => null;
  try {
    const W = 1200, ratio = im.naturalWidth / W, H = Math.round(im.naturalHeight / ratio);
    if (H < 300 || H > 2200) return failed();
    const c = document.createElement('canvas'); c.width=W; c.height=H;
    const cx=c.getContext('2d',{willReadFrequently:true}); cx.drawImage(im,0,0,W,H);
    const data=cx.getImageData(0,0,W,H).data, L=new Float32Array(W*H);
    for(let p=0;p<L.length;p++) L[p]=.3*data[p*4]+.59*data[p*4+1]+.11*data[p*4+2];
    const runs=(arr,min)=>{const out=[];let a=-1;for(let i=0;i<=arr.length;i++){const on=i<arr.length&&arr[i]>min;if(on&&a<0)a=i;if(!on&&a>=0){out.push([a,i-1]);a=-1;}}return out;};
    const colScore=new Float32Array(W);
    for(let x=3;x<W-3;x++)for(let y=Math.floor(H*.14);y<H*.91;y++){const p=y*W+x;if(L[p]<215&&L[p]<L[p-3]-15&&L[p]<L[p+3]-15)colScore[x]++;}
    const vl=runs(colScore,H*.24);
    // 7개 요일은 같은 폭. 오른쪽 이미지 끝의 선은 잘릴 수 있어 끝점도 별도 확인한다.
    let chain=[];
    for(let a=0;a<vl.length-1;a++){
      const gap=vl[a+1][0]-vl[a][0]; if(gap<W*.09||gap>W*.17)continue;
      const cur=[vl[a]];
      for(let b=a+1;b<vl.length;b++){
        const delta=vl[b][0]-cur[cur.length-1][0];
        if(Math.abs(delta-gap)<=Math.max(3,gap*.025))cur.push(vl[b]);
        else if(delta>gap*1.04)break;
      }
      if(cur.length>chain.length)chain=cur;
    }
    if(chain.length<7||chain.length>8)return failed();
    if(chain.length===7){
      const gap=(chain[6][0]-chain[0][0])/6, edge=chain[6][0]+gap;
      if(Math.abs(edge-W)>5)return failed();
      // 잘린 오른쪽 끝점은 등간격과 뒤의 경계 지지 검사를 통과해야 한다.
      chain.push([W-1,W-1]);
    }
    const dayX=chain[0][0], leftLines=vl.filter(v=>v[1]<dayX-5);
    const clippedLeft=leftLines.length===1&&leftLines[0][0]<W*.06; if(clippedLeft)leftLines.unshift([0,0]); if(leftLines.length<2)return failed();
    const labelLeft=leftLines[leftLines.length-2],labelRight=leftLines[leftLines.length-1];
    if(labelRight[0]-labelLeft[1]<15)return failed();
    const xa=labelLeft[1]+5, xb=labelRight[0]-5;
    if(xb-xa<8)return failed();
    const labelScore=new Float32Array(H), rowScore=new Float32Array(H);
    for(let y=5;y<H-5;y++){
      let n=0;
      for(let x=xa;x<=xb;x++){
        const p=y*W+x,l=L[p],up=L[p-3*W],down=L[p+3*W];
        if(l<220&&l<up-12&&l<down-12)n++;
      }
      labelScore[y]=n/(xb-xa+1);
      for(let x=dayX+4;x<W-4;x++){const p=y*W+x;if(L[p]<215&&L[p]<L[p-3*W]-15&&L[p]<L[p+3*W]-15)rowScore[y]++;}
    }
    const rawRows=runs(labelScore,.65).filter(v=>v[0]>H*.08&&v[0]<H*.95), edges=[];
    for(const r of rawRows){const last=edges[edges.length-1];if(last&&r[0]-last[1]<=4)last[1]=r[1];else edges.push([...r]);}
    if(clippedLeft){const supports=edges.map(edge=>{const y=Math.round((edge[0]+edge[1])/2);let supported=0;for(let k=0;k<7;k++){let hit=0,total=0;for(let x=chain[k][1]+5;x<chain[k+1][0]-5;x++){total++;let on=false;for(let yy=Math.max(4,y-3);yy<=Math.min(H-5,y+3);yy++){const p=yy*W+x;if(L[p]<220&&L[p]<L[p-3*W]-12&&L[p]<L[p+3*W]-12){on=true;break;}}if(on)hit++;}if(hit/Math.max(1,total)>.45)supported++;}return supported;}); for(let i=edges.length-1;i>=0;i--)if(supports[i]<4)edges.splice(i,1);}
    // 마지막 선 대신 지속적인 바닥 배경 전환이 있는 경우만 종료 경계로 보완한다.
    if(edges.length===4){
      for(let y=edges[3][1]+Math.floor(H*.07);y<H*.94;y++){
        let supported=0,total=0;
        for(let x=xa;x<=xb;x++){total++;const before=L[(y-5)*W+x];if(before-L[(y+8)*W+x]>40&&before-L[(y+16)*W+x]>40)supported++;}
        if(supported/total>.85){
          let across=0;for(let k=0;k<7;k++){const x=Math.round((chain[k][1]+chain[k+1][0])/2);if(L[(y-5)*W+x]-L[(y+8)*W+x]>30)across++;}
          if(across>=4){let bestY=y,bestDrop=0;for(let yy=y;yy<=y+10;yy++){let drop=0;for(let x=xa;x<=xb;x++)drop+=L[(yy-1)*W+x]-L[(yy+1)*W+x];if(drop>bestDrop){bestDrop=drop;bestY=yy;}}edges.push([bestY-1,bestY+1]);break;}
        }
      }
    }
    // 식사명 병합 열에는 4개 식사 바깥 경계 5개만 있어야 한다. 부가 메뉴선은 이 열을 통과하지 않는다.
    if(edges.length!==5)return failed();
    const horizontal=runs(rowScore,(W-dayX)*.38);
    const before=horizontal.filter(v=>v[1]<edges[0][0]-2);
    if(before.length<1)return failed();
    const weekdayTop=before[before.length-1];
    const earlier=before.length>1?before[before.length-2]:null;
    // 날짜/요일 두 줄의 위쪽 경계가 긴 선으로 안 잡히면 라벨색 전환에서 찾는다.
    let stripTop=earlier&&weekdayTop[0]-earlier[1]<2*(edges[0][0]-weekdayTop[0])?earlier[1]+1:Math.max(0,weekdayTop[0]-(edges[0][0]-weekdayTop[0]));
    const bands=MEAL_KEYS.map((key,i)=>({key,top:edges[i][1]+1,bottom:edges[i+1][0]-1}));
    for(const b of bands)if(b.bottom-b.top<H*.065||b.bottom-b.top>H*.4)return failed();
    const widths=chain.slice(0,7).map((v,i)=>chain[i+1][0]-v[1]);
    const mean=widths.reduce((a,b)=>a+b)/7;
    if(widths.some(v=>Math.abs(v-mean)>mean*.05))return failed();
    // 서로 다른 요일에서 경계 근거가 반복되는지 확인한다. 선이 일부 끊겨도 4칸 이상은 지지해야 한다.
    for(const edge of edges.slice(0,4)){
      const y=Math.round((edge[0]+edge[1])/2);let supported=0;
      for(let k=0;k<7;k++){let hit=0,total=0;for(let x=chain[k][1]+5;x<chain[k+1][0]-5;x++){total++;let on=false;for(let yy=Math.max(4,y-3);yy<=Math.min(H-5,y+3);yy++){const p=yy*W+x;if(L[p]<220&&L[p]<L[p-3*W]-12&&L[p]<L[p+3*W]-12){on=true;break;}}if(on)hit++;}if(hit/Math.max(1,total)>.45)supported++;}
      if(supported<4)return failed();
    }
    const toOriginal=v=>Math.round(v*ratio), bounds=edges.map(v=>v.map(toOriginal));
    const meals={};
    const cols=chain.map(v=>v.map(toOriginal));cols[7][0]=Math.min(im.naturalWidth-1,cols[7][0]);cols[7][1]=Math.min(im.naturalWidth-1,cols[7][1]);

    // 정규화 과정의 1~2px 오차는 원본 픽셀에서 다시 정밀화한다.
    const native=document.createElement('canvas');native.width=im.naturalWidth;native.height=im.naturalHeight;
    const nc=native.getContext('2d',{willReadFrequently:true});nc.drawImage(im,0,0);const nd=nc.getImageData(0,0,native.width,native.height).data;
    const lum=(x,y)=>{const p=(y*native.width+x)*4;return .3*nd[p]+.59*nd[p+1]+.11*nd[p+2];};
    const offset=Math.max(2,Math.round(ratio*3)),radius=Math.max(2,Math.ceil(ratio*2));
    for(let k=0;k<7;k++){
      const scores=[];let peak=0;
      for(let x=Math.max(offset,cols[k][0]-radius);x<=Math.min(native.width-offset-1,cols[k][1]+radius);x++){let score=0;for(let y=bounds[0][1]+3;y<bounds[4][0]-3;y++)if(lum(x,y)<215&&lum(x,y)<lum(x-offset,y)-15&&lum(x,y)<lum(x+offset,y)-15)score++;scores.push([x,score]);peak=Math.max(peak,score);}
      const good=scores.filter(v=>v[1]>=peak*.85&&v[1]>(bounds[4][0]-bounds[0][1])*.3);if(good.length)cols[k]=[good[0][0],good[good.length-1][0]];
    }
    for(let k=0;k<5;k++){
      const scores=[];let peak=0;
      for(let y=Math.max(offset,bounds[k][0]-radius);y<=Math.min(native.height-offset-1,bounds[k][1]+radius);y++){let score=0;for(let x=toOriginal(xa);x<=toOriginal(xb);x++)if(lum(x,y)<220&&lum(x,y)<lum(x,y-offset)-12&&lum(x,y)<lum(x,y+offset)-12)score++;scores.push([y,score]);peak=Math.max(peak,score);}
      const good=scores.filter(v=>v[1]>=peak*.8&&v[1]>(toOriginal(xb)-toOriginal(xa))*.6);if(good.length)bounds[k]=[good[0][0],good[good.length-1][0]];
    }
    for(let i=0;i<4;i++)meals[MEAL_KEYS[i]]=[bounds[i][1]+1,bounds[i+1][0]-1];
    return {cols,strip:[toOriginal(stripTop),bounds[0][0]-1],meals};
  }catch(e){return failed();}
}


function crop(canvas,day,range){
  const x=grid.cols[day][1]+1,w=grid.cols[day+1][0]-x-1,h=range[1]-range[0]+1;
  canvas.width=w*3;canvas.height=h*3;
  const ctx=canvas.getContext('2d');ctx.imageSmoothingQuality='high';
  ctx.drawImage(image,x,range[0],w,h,0,0,canvas.width,canvas.height);
}
function render(){
  if(!notice)return;
  const date=notice.weekStart&&new Date(notice.weekStart);
  if(date)date.setDate(date.getDate()+selectedDay);
  const meal=MEALS.find(m=>m.key===selectedMeal);
  $('badge').textContent=(date?(date.getMonth()+1)+'월 '+date.getDate()+'일 ':'')+DOW[selectedDay]+'요일 '+meal.label;
  document.querySelectorAll('.day').forEach((b,i)=>b.setAttribute('aria-pressed',i===selectedDay));
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.meal===selectedMeal));
  const key=notice.fileNm+'|'+selectedDay+'|'+selectedMeal;
  if(painted===key)return;
  painted=key;
  $('dateStrip').hidden=$('cell').hidden=!grid;$('whole').hidden=!!grid;
  if(grid){crop($('dateStrip'),selectedDay,grid.strip);crop($('cell'),selectedDay,grid.meals[selectedMeal]);}
  else if($('whole').getAttribute('src')!==notice.fileNm)$('whole').src=notice.fileNm;
}
function pickCurrent(rows,date){
  const started=rows.filter(n=>{const d=weekStartOf(n);return d&&d<=date;});
  return rows.find(n=>inWeek(date,weekStartOf(n)))||started.at(-1)||rows.at(-1);
}
function sync(){
  if(!notice)return;
  if(manual&&Date.now()-lastTouch>=IDLE_MS)manual=false;
  if(!manual){
    const now=new Date(),meal=mealAt(now),date=new Date(now);date.setDate(date.getDate()+meal.dayShift);
    const current=pickCurrent(available,date);
    if(current&&current.boardIdx!==notice.boardIdx&&!busy){run(()=>show(current),true);return;}
    selectedMeal=meal.key;selectedDay=inWeek(date,notice.weekStart)?dayIndex(date):0;
  }
  render();
}
async function show(n){
  const nextImage=await loadImage(n.fileNm), nextGrid=detectGrid(nextImage);
  image=nextImage;grid=nextGrid;notice={...n,weekStart:weekStartOf(n)};painted='';
  try{localStorage.setItem('mealIdx',String(n.boardIdx));}catch{}
  document.querySelectorAll('.day').forEach((b,i)=>{
    const d=notice.weekStart&&new Date(notice.weekStart);if(d)d.setDate(d.getDate()+i);
    b.querySelector('small').textContent=d?(d.getMonth()+1)+'/'+d.getDate():'';
    b.setAttribute('aria-label',(d?(d.getMonth()+1)+'월 '+d.getDate()+'일 ':'')+DOW[i]+'요일');
  });
  $('view').hidden=false;status('');sync();
}
async function run(task,silent=false){
  if(busy)return;
  busy=true;$('prev').disabled=$('next').disabled=true;
  if(!silent)status('식단을 불러오는 중…');
  try{await task();}catch(error){status(error.message||'식단을 불러오지 못했어요.');}
  finally{
    busy=false;$('prev').disabled=$('next').disabled=false;
    if(homePending){homePending=false;manual=false;sync();}
    if(!busy&&refreshPending){refreshPending=false;refresh(true);}
  }
}
function refresh(silent=false){
  if(busy){refreshPending=true;return;}
  return run(async()=>{
    let id=SEED_IDX;try{id=+localStorage.getItem('mealIdx')||SEED_IDX;}catch{}
    const seed=await fetchNotice(id)||await fetchNotice(SEED_IDX);
    if(!seed)throw new Error('식단 공지를 불러오지 못했어요. 화면을 다시 열어 주세요.');
    const form=signature(seed.title),chain=[seed];
    for(let n=seed;(n=await findSame(n.boardIdx,1,form));)chain.push(n);
    const today=new Date();today.setDate(today.getDate()+mealAt(today).dayShift);today.setHours(0,0,0,0);
    for(let n=seed,k=0;k<6&&(weekStartOf(n)||0)>today;k++){
      n=await findSame(n.boardIdx,-1,form);if(!n)break;chain.unshift(n);
    }
    available=chain;const pick=pickCurrent(available,today);
    if(silent&&manual&&Date.now()-lastTouch<IDLE_MS){status('');sync();return;}
    manual=false;
    if(!notice||notice.boardIdx!==pick.boardIdx||notice.fileNm!==pick.fileNm)await show(pick);
    else {status('');sync();}
  },silent);
}
function go(direction){
  if(!notice)return;
  return run(async()=>{
    const n=await findSame(notice.boardIdx,direction,signature(notice.title));
    if(!n){status(direction<0?'더 이전 식단이 없어요.':'더 최신 식단이 없어요.');return;}
    manual=true;lastTouch=Date.now();await show(n);
  });
}
DOW.forEach((name,i)=>{
  const b=document.createElement('button');b.className='day';b.dataset.day=i;
  b.innerHTML=name+'<small></small>';b.onclick=()=>{manual=true;lastTouch=Date.now();selectedDay=i;render();};
  $('days').insertBefore(b,$('next'));
});
MEALS.forEach(meal=>{
  const b=document.createElement('button');b.className='tab';b.dataset.meal=meal.key;b.setAttribute('role','tab');
  b.innerHTML=meal.label+'<small>'+meal.time+'</small>';
  b.onclick=()=>{manual=true;lastTouch=Date.now();selectedMeal=meal.key;render();};$('tabs').append(b);
});
$('prev').onclick=()=>go(-1);$('next').onclick=()=>go(1);
$('home').onclick=()=>{manual=false;if(busy)homePending=true;else sync();};
document.addEventListener('pointerdown',()=>{if(manual)lastTouch=Date.now();});
setInterval(sync,60000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refresh(true);});
refresh();
})();
</script>
</body>
